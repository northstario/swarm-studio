    <main class="ws-body" id="ws-body">
      <section class="graph-panel" id="graph-panel" aria-label="Knowledge graph">
        <svg id="graph"></svg>
        <div class="graph-empty" id="graph-empty"></div>
        <div class="graph-tools"><span class="chip" id="graph-count"></span></div>
        <div class="legend" id="legend"></div>
        <div id="node-card"></div>
      </section>
      <section class="work" id="work"></section>
    </main>
    <details class="console" id="console"><summary><span>Console</span><span class="dim" id="console-last"></span></summary><div class="lines" id="console-lines"></div></details>
  </div>`;
  $('#stepper').onclick = (e) => { const b = e.target.closest('.step'); if (b && !b.disabled) setTab(b.dataset.k); };
  $('#layout').onclick = (e) => { const l = e.target.dataset.l; if (!l) return; S.layout = l; renderHead(); setTimeout(centerGraph, 320); };
  $('#status').onclick = onWorkClick;
  $('#work').addEventListener('click', onWorkClick);
  $('#work').addEventListener('input', onWorkInput);
  $('#work').addEventListener('change', onWorkInput);
  $('#work').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.dataset.send) { e.preventDefault(); $(`[data-act="${e.target.dataset.send}"]`)?.click(); }
  });
  for (const row of S.sim.log) addLog(row);
  initGraph();
  updateGraph();
}

function renderHead() {
  const m = S.sim.meta;
  const running = Engine.busyWith(m.id);
  $('#ws-title').textContent = m.name;
  $('#ws-title').title = m.requirement;
  $('#stepper').innerHTML = steps(m).map((s, i) => `<button class="step ${s.done ? 'done' : ''} ${s.live ? 'live' : ''} ${S.tab === s.key ? 'active' : ''}" data-k="${s.key}" ${s.locked ? 'disabled' : ''}><span class="n">${s.done ? '✓' : i + 1}</span>${s.label}</button>`).join('');
  const msg = m.message && m.message !== STATUS_STYLE[m.status]?.[0] ? m.message : '';
  $('#status').innerHTML = `${statusChip(m.status)}${running ? `<div class="bar"><i style="width:${m.progress || 0}%"></i></div>` : ''}<span class="txt" style="${m.error ? 'color:var(--red)' : ''}" title="${esc(msg)}">${esc(msg)}</span>${
    running ? '<button class="btn sm danger" data-act="stop">Stop</button>' : m.status === 'paused' ? '<button class="btn sm primary" data-act="resume">Resume</button>' : ''}`;
  $('#calls').textContent = `${m.usage.calls} Claude calls`;
  for (const b of $('#layout').children) b.classList.toggle('on', b.dataset.l === S.layout);
  $('#ws-body').className = `ws-body ${S.layout === 'graph' ? 'l-graph' : S.layout === 'work' ? 'l-work' : ''}`;
}

let renderTimer = null;
function rerender(tab) {
  if (tab && S.tab !== tab) return;
  if (S.tab === 'interact') return;
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderWork, 200);
}

function renderWork() {
  if (!S.sim) return;
  $('#work').innerHTML = { graph: graphTab, setup: setupTab, simulation: simTab, report: reportTab, interact: interactTab }[S.tab]();
  if (S.tab === 'simulation') { renderFeeds(); renderSimLive(); }
  if (S.tab === 'interact') { const box = $('.chatbox'); if (box) box.scrollTop = box.scrollHeight; }
}

// Engine -> UI notifications (the engine already updated the shared sim object).
let homeTimer = null;
function onEngine(id, type, data) {
  if (!S.sim) { if (type === 'meta') { clearTimeout(homeTimer); homeTimer = setTimeout(renderHomeData, 400); } return; }
  if (S.sim.meta.id !== id) return;
  if (type === 'meta') return onMeta();
  if (type === 'log') return addLog(data);
  if (type === 'graph') { updateGraph(); return rerender('graph'); }
  if (type === 'agents') return rerender('setup');
  if (type === 'actions') return onActions(data);
  if (type === 'report') return rerender('report');
  if (type === 'stream') return onStream();
  if (type === 'chat') { S.chatStep = `${data.tool} ${data.input?.pattern || data.input?.name || ''}`; const el = $('#chat-steps'); if (el) el.textContent = S.chatStep; }
}

function onMeta() {
  const m = S.sim.meta;
  renderHead();
  const changed = S.seen.status !== m.status || S.seen.stage !== m.stage;
  S.seen = { status: m.status, stage: m.stage };
  if (changed && S.follow && autoTab(m) !== S.tab) return setTab(autoTab(m), false);
  if (changed) return rerender();
  if (S.tab === 'simulation') return renderSimLive();
  for (const el of document.querySelectorAll('[data-bind="msg"]')) el.textContent = m.message || '';
  for (const el of document.querySelectorAll('[data-bind="bar"]')) el.style.width = `${m.progress || 0}%`;
}

function addLog(row) {
  const lines = $('#console-lines');
  if (!lines) return;
  const t = new Date(row.ts);
  lines.insertAdjacentHTML('beforeend', `<div class="${row.level}">${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}  ${esc(row.msg)}</div>`);
  while (lines.children.length > 300) lines.firstChild.remove();
  lines.scrollTop = lines.scrollHeight;
  $('#console-last').textContent = `— ${row.msg}`;
}

// ---------- graph + setup tabs ----------
function typeColor(type) {
  const types = S.sim?.ontology?.entity_types?.map((t) => t.name) || [];
  const i = types.indexOf(type);
  if (i >= 0) return PALETTE[i % PALETTE.length];
  let h = 0;
  for (const c of String(type)) h = (h * 31 + c.charCodeAt(0)) % 997;
  return PALETTE[h % PALETTE.length];
}

function stageState(key) {
  const m = S.sim.meta;
  if (phase(m) !== 'prep') return 'done';
  const cur = STAGE_ORDER.indexOf(m.stage);
  const idx = STAGE_ORDER.indexOf(key);
  if (idx < cur) return 'done';
  if (idx === cur) return m.status === 'paused' ? 'paused' : 'live';
  return 'pending';
}

const stageBadge = (st) => (st === 'done' ? '<span class="chip" style="color:var(--aurora)">Done</span>'
  : st === 'live' ? '<span class="chip" style="color:var(--teal)"><span class="spinner"></span>Working</span>'
    : st === 'paused' ? '<span class="chip" style="color:var(--amber)">Paused</span>' : '<span class="chip dim">Waiting</span>');

function pausedCard() {
  const m = S.sim.meta;
  if (m.status !== 'paused' || Engine.busyWith(m.id)) return '';
  return `<div class="card" style="border-color:rgba(251,191,36,.5);display:flex;flex-direction:column;gap:10px"><b style="color:var(--amber)">Paused</b><span class="muted">${esc(m.message)}</span><div><button class="btn primary" data-act="resume">Resume</button></div></div>`;
}

const graphOf = (sim) => sim.graph || sim.graphPreview;
const agentsOf = (sim) => sim.agents || sim.agentsPreview || [];

function graphTab() {
  const { meta, ontology } = S.sim;
  const g = graphOf(S.sim) || { nodes: [], edges: [] };
  const ont = ontology || { entity_types: [], edge_types: [] };
  const st = { ontology: stageState('ontology'), graph: stageState('graph') };
  return `<div class="stack">
    <div><h2>Knowledge graph</h2><div class="muted">The real actors in your material and how they relate. Each one becomes an agent.</div></div>
    ${pausedCard()}
    <div class="stage done"><div class="num">01</div><div class="card"><div class="stage-head"><b>Read material</b>${stageBadge('done')}</div>
      <div class="tags">${(meta.docs || []).map((d) => `<span class="chip">${esc(d)}</span>`).join('')}</div></div></div>
    <div class="stage ${st.ontology}"><div class="num">02</div><div class="card">
      <div class="stage-head"><b>Ontology</b>${stageBadge(st.ontology)}</div>
      ${ont.entity_types.length ? `<span class="label">Actor types</span>
      <div class="tags">${ont.entity_types.map((t) => `<span class="chip" title="${esc(t.description)}"><span class="dot" style="background:${typeColor(t.name)}"></span>${esc(t.name)}</span>`).join('')}</div>
      <span class="label">Relationship types</span>
      <div class="tags">${ont.edge_types.map((t) => `<span class="chip mono" style="font-size:11px" title="${esc(t.description)}">${esc(t.name)}</span>`).join('')}</div>
      ${ont.analysis_summary ? `<div class="tip">${esc(ont.analysis_summary)}</div>` : ''}` : '<div class="dim">Claude reads the material and decides which kinds of actors matter.</div>'}
    </div></div>
    <div class="stage ${st.graph}"><div class="num">03</div><div class="card">
      <div class="stage-head"><b>Extract actors and relations</b>${stageBadge(st.graph)}</div>
      ${st.graph === 'live' ? `<div class="bar"><i data-bind="bar" style="width:${meta.progress}%"></i></div><div class="muted" style="font-size:12.5px" data-bind="msg">${esc(meta.message)}</div>` : ''}
      <div class="stats"><div class="stat"><b>${g.nodes.length}</b><span>entities</span></div><div class="stat"><b>${g.edges.length}</b><span>relations</span></div><div class="stat"><b>${new Set(g.nodes.map((n) => n.type)).size}</b><span>types in use</span></div></div>
    </div></div>
    ${steps(meta)[1].locked ? '' : '<div><button class="btn primary" data-tab="setup">Agent setup →</button></div>'}
  </div>`;
}

function personaCard(a) {
  return `<button class="persona st-${a.stance}" data-agent="${a.id}">
    <span class="top"><span class="avatar">${esc(initials(a.name))}</span><span class="who"><b>${esc(a.name)}</b><span>@${esc(a.username)}</span></span></span>
    <span class="tags"><span class="chip st-chip">${a.stance}</span><span class="chip">${esc(clip(a.profession || a.kind, 26))}</span>${a.ref ? '<span class="chip" title="From the source material">◆ source</span>' : ''}</span>
    <span class="bio">${esc(a.bio)}</span></button>`;
}

function hourStrip(on, peak = [], off = []) {
  return `<div class="hours" aria-hidden="true">${Array.from({ length: 24 }, (_, h) => `<i class="${on.includes(h) ? (peak.includes(h) ? 'peak' : 'on') : off.includes(h) ? 'off' : ''}" title="${pad(h)}:00"></i>`).join('')}</div>
  <div class="mono dim" style="display:flex;justify-content:space-between;font-size:10.5px"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>`;
}

const runEstimate = () => {
  const c = S.sim.config;
  const e = estimate(agentsOf(S.sim).length || S.sim.meta.settings.agents, S.runRounds);
  return `Each round covers ${c ? Math.max(c.minutes_per_round, Math.ceil((c.total_hours * 60) / S.runRounds)) : '?'} simulated minutes. About ${Math.max(1, Math.round(e.total * 0.8))} Claude calls for the run and report.`;
};

function setupTab() {
  const { meta, config } = S.sim;
  const agents = agentsOf(S.sim);
  const st = { personas: stageState('personas'), config: stageState('config') };
  const f = S.personaFilter;
  const shown = agents.filter((a) => f === 'all' || (f === 'source' ? a.ref : f === 'public' ? !a.ref : a.stance === f));
  const count = (fn) => agents.filter(fn).length;
  const ph = phase(meta);
  const canRun = !Engine.busyWith(meta.id) && !!config && !!S.sim.agents && ['ready', 'simdone', 'done', 'sim'].includes(ph);
  const rerun = simulatedYet(meta) || (ph === 'sim' && meta.status === 'paused');
  const byId = new Map(agents.map((a) => [a.id, a]));
  return `<div class="stack">
    <div><h2>Agent setup</h2><div class="muted">Every agent's persona, stance and online rhythm, plus the clock and the posts that start the conversation.</div></div>
    ${ph === 'prep' ? pausedCard() : ''}
    <div class="stage ${st.personas}"><div class="num">04</div><div class="card">
      <div class="stage-head"><b>Personas · ${agents.length}/${meta.settings.agents}</b>${stageBadge(st.personas)}</div>
      ${st.personas === 'live' ? `<div class="bar"><i data-bind="bar" style="width:${meta.progress}%"></i></div><div class="muted" style="font-size:12.5px" data-bind="msg">${esc(meta.message)}</div>` : ''}
      <div class="toolbar">${[['all', `All ${agents.length}`], ['source', `From the material ${count((a) => a.ref)}`], ['public', `Public ${count((a) => !a.ref)}`], ...STANCES.map((s) => [s, `${s} ${count((a) => a.stance === s)}`])]
        .map(([k, l]) => `<button class="chip click ${f === k ? 'on' : ''} ${STANCES.includes(k) ? `st-${k}` : ''}" data-pf="${k}">${l}</button>`).join('')}</div>
      <div class="personas">${shown.map(personaCard).join('') || '<div class="dim">Personas appear here as Claude writes them.</div>'}</div>
    </div></div>
    <div class="stage ${st.config}"><div class="num">05</div><div class="card">
      <div class="stage-head"><b>Clock and opening moves</b>${stageBadge(st.config)}</div>
      ${config ? `
      <div class="stats"><div class="stat"><b>${config.total_hours}h</b><span>simulated span</span></div><div class="stat"><b>${pad(config.start_hour)}:00</b><span>story breaks${config.timezone ? ` · ${esc(config.timezone)}` : ''}</span></div><div class="stat"><b>${config.initial_posts.length}</b><span>opening posts</span></div></div>
      <span class="label">Daily rhythm · <span style="color:var(--magenta)">peak</span> / <span style="color:var(--teal)">active</span> / quiet</span>
      ${hourStrip(Array.from({ length: 24 }, (_, h) => h).filter((h) => !config.off_peak_hours.includes(h)), config.peak_hours, config.off_peak_hours)}
      <span class="label">Hot topics</span>
      <div class="tags">${config.hot_topics.map((t) => `<span class="chip">#${esc(t)}</span>`).join('')}</div>
      ${config.narrative_direction ? `<div class="tip"><b>Expected direction (a guess, not a result):</b> ${esc(config.narrative_direction)}</div>` : ''}
      <span class="label">Opening posts</span>
      <div class="timeline">${config.initial_posts.map((p) => { const a = byId.get(p.poster_id); return `<div class="ev" style="--c:${p.platform === 'twitter' ? 'var(--micro)' : 'var(--forum)'}"><div class="mono dim" style="font-size:11.5px">${p.platform === 'twitter' ? 'Microblog' : 'Forum'} · @${esc(a?.username)}</div>${p.title ? `<b>${esc(p.title)}</b><br>` : ''}<span>${esc(p.content)}</span></div>`; }).join('')}</div>` : '<div class="dim">Set after the personas are written.</div>'}
    </div></div>
    <div class="card run-box">
      <div class="stage-head"><b>Run the simulation</b>${rerun ? '<span class="chip" style="color:var(--amber)">Starting over replaces the current run and report</span>' : ''}</div>
      <div class="field"><div class="slider-head"><label class="label" for="run-rounds">Rounds</label><b id="run-rounds-v">${S.runRounds}</b></div><input type="range" id="run-rounds" min="1" max="100" value="${S.runRounds}"></div>
      <div class="muted" style="font-size:12.5px" id="run-est">${runEstimate()}</div>
      <div class="toolbar"><button class="btn primary" data-act="run" ${canRun ? '' : 'disabled'}>${rerun ? 'Start over' : 'Start simulation'}</button>${Engine.busyWith(meta.id) ? '<span class="muted" style="font-size:12.5px">Running now…</span>' : ''}</div>
    </div>
  </div>`;
}

// ---------- simulation tab ----------
function simTab() {
  const m = S.sim.meta;
  const running = Engine.busyWith(m.id) && m.status === 'running';
  return `<div class="stack">
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:200px"><h2>Simulation</h2><div class="muted">Two platforms run side by side. Claude plays each active agent from their persona, memory and feed.</div></div>
      ${running ? '<button class="btn danger" data-act="stop">Stop</button>' : ''}
      ${m.status === 'simulated' && !Engine.busyWith(m.id) ? '<button class="btn primary" data-act="report">Generate report →</button>' : ''}
      ${['reporting', 'reported'].includes(m.status) ? '<button class="btn" data-tab="report">Open report →</button>' : ''}
    </div>
    ${phase(m) === 'sim' ? pausedCard() : ''}
    ${running ? '<div class="note">Keep this tab open while it runs. Each round is saved, so if the tab closes you can resume from the last round.</div>' : ''}
    <div class="tiles" id="tiles"></div>
    <div class="card" style="padding:12px 14px"><div class="label" style="margin-bottom:6px">Actions per round · <span style="color:var(--micro)">microblog</span> / <span style="color:var(--forum)">forum</span></div><svg class="chart" id="chart" preserveAspectRatio="none" role="img" aria-label="Actions per round"></svg></div>
    <div class="toolbar"><div class="seg">${[['all', 'All actions'], ['writes', 'Posts and comments']].map(([k, l]) => `<button data-feed="${k}" class="${S.feedMode === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="feeds">
      <div class="feed-col"><div class="label"><span class="dot" style="background:var(--micro)"></span>Microblog</div><div class="feed" id="feed-twitter"></div></div>
      <div class="feed-col"><div class="label"><span class="dot" style="background:var(--forum)"></span>Forum</div><div class="feed" id="feed-reddit"></div></div>
    </div>
  </div>`;
}

function renderSimLive() {
  if (S.tab !== 'simulation' || !$('#tiles')) return;
  const m = S.sim.meta;
  const c = m.counts || {};
  const sim = m.sim || {};
  $('#tiles').innerHTML = `
    <div class="tile"><span class="label">Round</span><b>${sim.round ?? 0}<span class="dim" style="font-size:14px">/${sim.rounds ?? m.settings.rounds}</span></b><small>${esc(sim.clock || '')}</small></div>
    <div class="tile"><span class="label"><span class="dot" style="background:var(--micro)"></span>Microblog</span><b>${c.twitter || 0}</b><small>actions</small></div>
    <div class="tile"><span class="label"><span class="dot" style="background:var(--forum)"></span>Forum</span><b>${c.reddit || 0}</b><small>actions</small></div>
    <div class="tile"><span class="label">Content</span><b>${(c.posts || 0) + (c.comments || 0)}</b><small>${c.posts || 0} posts · ${c.comments || 0} comments</small></div>
    <div class="tile"><span class="label">Claude</span><b>${m.usage.calls}</b><small>calls so far</small></div>`;
  const per = new Map();
  for (const a of S.sim.actions) { const r = per.get(a.round) || { twitter: 0, reddit: 0 }; r[a.platform]++; per.set(a.round, r); }
  const rounds = Math.max(sim.rounds || m.settings.rounds, ...per.keys(), 1);
  const max = Math.max(1, ...[...per.values()].map((r) => r.twitter + r.reddit));
  const w = 100 / (rounds + 1);
  let bars = '<line x1="0" y1="69.5" x2="100" y2="69.5" stroke="rgba(200,255,235,0.15)" stroke-width="0.4"/>';
  for (const [r, v] of per) {
    const ht = (v.twitter / max) * 64;
    const hr = (v.reddit / max) * 64;
    bars += `<rect x="${r * w + w * 0.12}" y="${69 - ht}" width="${w * 0.76}" height="${ht}" fill="#38bdf8"/><rect x="${r * w + w * 0.12}" y="${69 - ht - hr}" width="${w * 0.76}" height="${hr}" fill="#fb923c"/>`;
  }
  $('#chart').setAttribute('viewBox', '0 0 100 70');
  $('#chart').innerHTML = bars;
}

function postCard(a) {
  const ag = S.sim.agents?.[a.agent_id] || { stance: 'neutral', name: a.handle };
  const verb = a.action === 'LIKE_POST' ? (a.platform === 'twitter' ? 'liked' : 'upvoted') : VERB[a.action] || a.action;
  let body = '';
  if (WRITES.has(a.action)) body += `<div class="body">${a.title ? `<b>${esc(a.title)}</b>` : ''}${esc(a.content)}</div>`;
  if (a.ref_author) body += `<div class="ref">${a.action === 'CREATE_COMMENT' ? 'on ' : ''}@${esc(a.ref_author)}: ${esc(a.ref_content)}</div>`;
  if (a.target) body += `<div class="body muted">@${esc(a.target)}</div>`;
  return `<article class="post st-${ag.stance}">
    <div class="top"><span class="avatar" data-agent="${a.agent_id}">${esc(initials(ag.name))}</span>
    <div class="meta"><b data-agent="${a.agent_id}" style="cursor:pointer">${esc(ag.name)}</b> <span>@${esc(a.handle)} · ${verb}</span></div>
    <span class="badge ${WRITES.has(a.action) ? 'write' : ''}">${a.action.replace(/_/g, ' ')}</span></div>
    ${body}
    <div class="foot">R${a.round} · Day ${a.day} ${pad(a.hour)}:00${a.post_id ? ` · ${a.new_post_id || a.comment_id || a.post_id}` : ''}</div>
  </article>`;
}

const feedFilter = (a) => S.feedMode === 'all' || WRITES.has(a.action);

function renderFeeds() {
  for (const p of PLATFORMS) {
    const el = $(`#feed-${p}`);
    if (!el) continue;
    const items = S.sim.actions.filter((a) => a.platform === p && feedFilter(a)).slice(-150).reverse();
    el.innerHTML = items.map(postCard).join('') || '<div class="dim">Nothing yet.</div>';
  }
}

function onActions(list) {
  if (S.tab !== 'simulation') return;
  for (const p of PLATFORMS) {
    const el = $(`#feed-${p}`);
    if (!el) continue;
    const add = list.filter((a) => a.platform === p && feedFilter(a));
    if (!add.length) continue;
    if (el.firstElementChild?.classList.contains('dim')) el.innerHTML = '';
    el.insertAdjacentHTML('afterbegin', add.reverse().map(postCard).join(''));
    while (el.children.length > 150) el.lastChild.remove();
  }
  renderSimLive();
}

// ---------- report tab ----------
function reportTab() {
  const { meta, report } = S.sim;
  const outline = report.outline;
  const running = Engine.busyWith(meta.id) && meta.status === 'reporting';
  if (!outline && !running) {
    return `<div class="stack"><h2>Prediction report</h2>
      <div class="card run-box"><b>Turn the simulation into a report</b><span class="muted">Every agent answers an exit poll first, which feeds the charts and the per-agent feedback. Then a report agent plans an outline, interviews a handful of agents, and writes each section by searching the full record of posts, threads and stats. Every search it runs shows up beside the report.</span>
      <div><button class="btn primary" data-act="report" ${simulatedYet(meta) && !Engine.busyWith(meta.id) ? '' : 'disabled'}>Generate report</button></div></div></div>`;
  }
  const log = report.log;
  const total = outline?.sections.length || 0;
  const liveIdx = running ? [...log].reverse().find((e) => e.kind === 'section_start')?.section : -1;
  const tools = log.filter((e) => e.kind === 'tool_call').length;
  const done = meta.status === 'reported' && !running;
  const paper = outline ? `
    <div class="paper">
      <div class="stage-head"><span class="label">Prediction report</span>
      ${done ? `<span class="toolbar">${S.downloads ? '<button class="btn sm" data-act="download">Download .md</button><button class="btn sm" data-act="download-pdf">Download .pdf</button>' : ''}<button class="btn sm" data-act="report">Regenerate</button></span>` : ''}</div>
      <h1>${esc(outline.title)}</h1>
      <p class="summary">${esc(outline.summary)}</p>
      ${outline.takeaways?.length ? `<ul class="takeaways">${outline.takeaways.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${visualSummary(S.sim)}
      <h2 class="part">Analyst write-up</h2><div class="muted">Written by the report agent from the full record of posts, threads, stats, interviews and the exit poll.</div>
      ${outline.sections.map((s, i) => `<div class="sec" data-sec="${i}"><h3><span class="n">${pad(i + 1)}</span>${esc(s.title)}${i === liveIdx ? ' <span class="spinner"></span>' : ''}</h3>
        <div class="md">${report.sections[i] ? md(report.sections[i]) : report.live?.section === i ? md(report.live.text) : `<span class="dim" style="font-size:13px">${i === liveIdx ? 'Gathering evidence…' : running ? 'Queued' : 'Not written. Regenerate to finish the report.'}</span>`}</div></div>`).join('')}
      <h2 class="part">What every agent said</h2><div class="muted">Each agent's exit-poll answer in their own words, most influential first. Click a name to open the persona.</div>
      ${feedbackBlock(S.sim)}
    </div>` : `<div class="paper"><span class="spinner"></span> <span class="muted" data-bind="msg">${esc(meta.message || 'Planning the outline…')}</span></div>`;
  const tiles = `<div class="tiles"><div class="tile"><span class="label">Sections</span><b>${report.sections.filter(Boolean).length}/${total || '…'}</b></div><div class="tile"><span class="label">Tool calls</span><b>${tools}</b></div><div class="tile"><span class="label">Elapsed</span><b>${Math.round(log.at(-1)?.t || 0)}s</b></div></div>`;
  const flow = `<div class="flow">${log.map(flowEvent).join('') || '<div class="dim">Starting…</div>'}</div>`;
  if (done) return `<div class="stack">${paper}<details class="card"><summary class="label" style="cursor:pointer">Agent workflow · ${tools} tool calls · ${Math.round(log.at(-1)?.t || 0)}s</summary><div class="stack" style="margin-top:12px">${tiles}${flow}</div></details></div>`;
  return `<div class="split2">
    <div>${paper}</div>
    <div class="stack">${tiles}<span class="label">Agent workflow</span>${flow}</div>
  </div>`;
}

function visualSummary(sim) {
  const d = reportData(sim);
  const top = (p) => `<article class="post st-${p.stance}"><div class="top"><span class="avatar" data-agent="${p.id}">${esc(initials(p.name))}</span><div class="meta"><b>${esc(p.name)}</b> <span>@${esc(p.handle)}</span></div></div><div class="body">${p.title ? `<b>${esc(p.title)}</b>` : ''}${esc(clip(p.content, 280))}</div><div class="foot">${esc(p.stat)}</div></article>`;
  const table = (t) => `<table class="dt"><thead><tr>${t.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c) => `<td${typeof c === 'string' ? '' : ' class="n"'}>${esc(cell(c))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return `<div class="tiles">${d.kpis.map((k) => `<div class="tile"><span class="label">${esc(k.label)}</span><b>${esc(k.value)}</b>${k.note ? `<small title="${esc(k.note)}">${esc(clip(k.note, 36))}</small>` : ''}</div>`).join('')}</div>
    ${d.poll ? '' : '<div class="note" style="margin-top:12px">This report was written before exit polls were added. Regenerate it to get votes, stance shifts and every agent\'s feedback.</div>'}
    <div class="viz-grid">${chartSpecs(d).map((s) => `<div class="card viz"><h4>${esc(s.title)}</h4><div class="sub">${esc(s.sub)}</div>${s.svg(VIZ.dark, 460)}<details><summary>Show the numbers</summary>${table(s.table)}</details></div>`).join('')}</div>
    ${d.topTw.length || d.topRd.length ? `<div class="feeds"><div class="feed-col"><span class="label"><span class="dot" style="background:var(--micro)"></span>Most engaging microblog posts</span><div class="feed">${d.topTw.map(top).join('')}</div></div><div class="feed-col"><span class="label"><span class="dot" style="background:var(--forum)"></span>Top forum threads</span><div class="feed">${d.topRd.map(top).join('')}</div></div></div>` : ''}`;
}

function feedbackBlock(sim) {
  const d = reportData(sim);
  if (!d.feedback) return '<div class="card dim">Regenerate the report to collect every agent\'s feedback.</div>';
  const f = S.fbFilter;
  const filters = [['all', `All ${d.feedback.length}`], ...d.poll.options.map((o, i) => [`v${i}`, `${clip(o, 30)} · ${d.feedback.filter((x) => x.vote === i).length}`]), ['changed', `Changed their mind · ${d.feedback.filter((x) => x.from !== x.to).length}`]];
  const shown = d.feedback.filter((x) => f === 'all' || (f === 'changed' ? x.from !== x.to : x.vote === Number(f.slice(1))));
  const card = (x) => `<div class="fb st-${x.to}"><div class="top" data-agent="${x.id}"><span class="avatar">${esc(initials(x.name))}</span><div class="who"><b>${esc(x.name)}</b><span>@${esc(x.handle)} · ${esc(clip(x.role, 32))}</span></div></div>
    <div class="tags"><span class="chip" title="${esc(x.voteLabel)}">Voted: ${esc(clip(x.voteLabel, 32))}</span><span class="chip st-chip">${x.from === x.to ? x.to : `${x.from} → ${x.to}`}</span><span class="chip">mood ${signed(x.m0)} → ${signed(x.m1)}</span></div>
    <p>${esc(x.text)}</p>${x.themes.length ? `<div class="tags">${x.themes.map((t) => `<span class="chip" style="font-size:11px">${esc(t)}</span>`).join('')}</div>` : ''}</div>`;
  return `<div class="toolbar">${filters.map(([k, l]) => `<button class="chip click ${f === k ? 'on' : ''}" data-fb="${k}" aria-pressed="${f === k}">${esc(l)}</button>`).join('')}</div>
    <div class="fb-grid">${shown.map(card).join('') || '<div class="dim">No agents in this group.</div>'}</div>`;
}

function onStream() {
  const live = S.sim.report.live;
  if (S.tab !== 'report' || !live) return;
  const el = $(`[data-sec="${live.section}"] .md`);
  if (el) el.innerHTML = md(live.text);
}

function flowEvent(e) {
  const t = `<span class="t">+${e.t}s</span>`;
  const sec = (i) => (Number.isInteger(i) ? `<span class="dim mono">§${i + 1}</span>` : '');
  switch (e.kind) {
    case 'poll_start': return `<div class="ev"><div class="h"><span class="tool interview">EXIT POLL</span>Asking all ${e.agents} agents${t}</div></div>`;
    case 'poll': return `<div class="ev"><div class="h"><span class="tool interview">POLL</span>${e.answered} answers${t}</div><pre>${esc(e.question)}</pre></div>`;
    case 'plan_start': return `<div class="ev"><div class="h"><span class="tool plan">PLAN</span>Reading stats and planning the outline${t}</div></div>`;
    case 'plan': return `<div class="ev"><div class="h"><span class="tool plan">OUTLINE</span>${e.outline.sections.length} sections${t}</div><pre>${esc(e.outline.sections.map((s, i) => `${i + 1}. ${s.title}`).join('\n'))}</pre></div>`;
    case 'section_start': return `<div class="ev" style="border-color:rgba(167,139,250,.4)"><div class="h"><span class="tool plan">SECTION ${e.section + 1}</span>${esc(e.title)}${t}</div></div>`;
    case 'tool_call': {
      const inp = e.input || {};
      const brief = inp.pattern ? `/${inp.pattern}/ ${inp.file || ''}` : inp.name ? `${inp.name} ${inp.start_line || ''}${inp.end_line ? `-${inp.end_line}` : ''}` : inp.questions ? `${(inp.agent_ids || []).length} agents · ${inp.questions.length} questions` : '';
      return `<div class="ev"><div class="h"><span class="tool ${e.tool === 'interview_agents' ? 'interview' : ''}">${esc(e.tool)}</span><span class="mono" style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${esc(brief)}</span>${sec(e.section)}${t}</div></div>`;
    }
    case 'tool_result': return `<div class="ev"><details><summary>Result${e.tool ? ` · ${esc(e.tool)}` : ''}</summary><pre>${esc(e.preview)}</pre></details></div>`;
    case 'section_done': return `<div class="ev"><div class="h" style="color:var(--aurora)">✓ ${esc(e.title)}${t}</div></div>`;
    case 'done': return `<div class="ev"><div class="h" style="color:var(--aurora)">Report complete${t}</div></div>`;
    default: return '';
  }
}

// ---------- interact tab ----------
function interactTab() {
  const m = S.sim.meta;
  if (!simulatedYet(m)) return '<div class="stack"><h2>Interact</h2><div class="card dim">Available once the simulation has run.</div></div>';
  const t = S.interactTab;
  const seg = `<div class="seg" style="align-self:flex-start">${[['report', 'Ask the report agent'], ['agent', 'Interview an agent'], ['survey', 'Survey many']].map(([k, l]) => `<button data-it="${k}" class="${t === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  return `<div class="stack"><div><h2>Interact</h2><div class="muted">Question the simulated world after the fact. Answers use your Claude account.</div></div>${seg}${t === 'report' ? reportChat() : t === 'agent' ? agentChat() : survey()}</div>`;
}

const bubble = (x, who) => (x.role === 'user' ? `<div class="msg user">${esc(x.content)}</div>` : `<div class="msg bot"><div class="who">${esc(who)}</div><div class="md">${md(x.content)}</div></div>`);
const typing = () => (S.pending ? `<div class="msg bot"><span class="spinner"></span> <span class="muted" id="chat-steps">${esc(S.chatStep || 'Thinking…')}</span></div>` : '');
const composer = (key, placeholder) => `<div class="composer"><textarea id="ta-${key}" rows="2" data-draft="${key}" data-send="${key}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}">${esc(S.drafts[key] || '')}</textarea><button class="btn primary" data-act="${key}" ${S.pending ? 'disabled' : ''}>Send</button></div>`;

function reportChat() {
  return `<div class="card stack">
    <div class="muted" style="font-size:13px">The report agent searches the full record (every post, thread, stat and interview) before answering.</div>
    <div class="chatbox">${S.chats.report.map((x) => bubble(x, 'Report agent')).join('') || '<div class="dim">Try: “Which argument changed the most minds?” or “What would make critics come around?”</div>'}${typing()}</div>
    ${composer('send-report', 'Ask about the simulation…')}</div>`;
}

function agentChat() {
  const agents = S.sim.agents || [];
  const sorted = [...agents].sort((a, b) => b.influence - a.influence);
  const id = S.interviewAgent ?? sorted[0]?.id;
  S.interviewAgent = id;
  const a = agents[id];
  const msgs = S.chats.agent[id] || [];
  return `<div class="card stack">
    <label class="label" for="agent-select">Agent</label>
    <select id="agent-select">${sorted.map((x) => `<option value="${x.id}" ${x.id === id ? 'selected' : ''}>@${esc(x.username)} — ${esc(x.name)} (${x.stance})</option>`).join('')}</select>
    ${a ? personaCard(a) : ''}
    <div class="chatbox">${msgs.map((x) => bubble(x, `@${a?.username}`)).join('') || '<div class="dim">They answer in character, from their persona and everything they did in the simulation.</div>'}${typing()}</div>
    ${composer('send-agent', `Ask @${a?.username || 'agent'} something…`)}</div>`;
}

function survey() {
  const agents = S.sim.agents || [];
  const f = S.survey.filter;
  const shown = agents.filter((a) => f === 'all' || a.stance === f);
  return `<div class="card stack">
    <div class="toolbar">${['all', ...STANCES].map((k) => `<button class="chip click ${f === k ? 'on' : ''} ${k !== 'all' ? `st-${k}` : ''}" data-sf="${k}">${k}</button>`).join('')}
      <span class="grow"></span><button class="btn sm" data-act="pick-all">Select shown</button><button class="btn sm" data-act="pick-none">Clear</button><span class="mono dim">${S.survey.picked.size} picked</span></div>
    <div class="pick-grid">${shown.map((a) => `<button class="pick st-${a.stance} ${S.survey.picked.has(a.id) ? 'on' : ''}" data-pick="${a.id}" aria-pressed="${S.survey.picked.has(a.id)}"><span class="avatar">${esc(initials(a.name))}</span><span>@${esc(a.username)}</span></button>`).join('')}</div>
    ${composer('send-survey', 'One question for everyone picked…')}
    ${S.pending ? '<div><span class="spinner"></span> <span class="muted">Interviewing…</span></div>' : ''}
    <div class="answers">${S.survey.results.map((r) => `<div class="card st-${r.stance}" style="padding:14px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:10px;align-items:center"><span class="avatar">${esc(initials(r.name))}</span><div><b>${esc(r.name)}</b><div class="mono dim" style="font-size:11.5px">@${esc(r.handle)} · ${r.stance}</div></div></div><div class="md">${md(r.answer)}</div></div>`).join('')}</div>
  </div>`;
}

async function sendChat(kind) {
  const key = `send-${kind}`;
  const text = (S.drafts[key] || '').trim();
  if (!text || S.pending) return;
  if (!AI.available) return toast('Claude is not available here. Open this page inside Claude.');
  const sim = S.sim;
  const ctx = makeCtx(sim);
  S.drafts[key] = '';
  S.pending = true;
  S.chatStep = '';
  try {
    if (kind === 'report') {
      const hist = S.chats.report;
      hist.push({ role: 'user', content: text });
      renderWork();
      const answer = await chat(ctx, text, hist.slice(0, -1));
      hist.push({ role: 'assistant', content: answer });
    } else if (kind === 'agent') {
      const aid = S.interviewAgent;
      const hist = (S.chats.agent[aid] ||= []);
      hist.push({ role: 'user', content: text });
      renderWork();
      const r = await interview(ctx, [aid], text, hist.slice(0, -1));
      hist.push({ role: 'assistant', content: r[0]?.answer || '(no answer)' });
    } else {
      if (!S.survey.picked.size) throw codeErr('none', 'Pick at least one agent first.');
      renderWork();
      S.survey.results = await interview(ctx, [...S.survey.picked], text);
    }
  } catch (e) {
    toast(e.code === 'rate_limited' ? 'Claude asked us to slow down. Try again in a few minutes.' : e.code === 'not_granted' ? 'Claude access for this page was declined.' : e.message || e.code);
    S.drafts[key] = text;
    if (kind === 'report') S.chats.report.pop();
    else if (kind === 'agent') S.chats.agent[S.interviewAgent]?.pop();
  }
  S.pending = false;
  Store.put(sim.meta.id, sim.meta).catch(() => {});
  if (S.sim === sim && S.tab === 'interact') { renderWork(); renderHead(); }
}

    <div class="tags"><span class="chip st-chip">${a.stance}</span><span class="chip">mood ${a.sentiment.toFixed(1)}</span>${a.age ? `<span class="chip">${a.age}</span>` : ''}${a.gender ? `<span class="chip">${esc(a.gender)}</span>` : ''}${a.mbti ? `<span class="chip">${esc(a.mbti)}</span>` : ''}${a.country ? `<span class="chip">${esc(a.country)}</span>` : ''}${a.ref ? `<span class="chip">◆ ${esc(a.source_type)} from the material</span>` : '<span class="chip">member of the public</span>'}</div>

    <div class="stats"><div class="stat"><b>${Math.round(a.activity * 100)}%</b><span>activity</span></div><div class="stat"><b>${a.influence.toFixed(1)}</b><span>influence</span></div><div class="stat"><b>${did.length}</b><span>actions in sim</span></div></div>
    <span class="label">Online hours</span>${hourStrip(a.active_hours)}
    ${simulatedYet(S.sim.meta) && S.sim.agents ? '<div><button class="btn primary" data-interview>Interview this agent</button></div>' : ''}

  };
  document.body.appendChild(bg);
  bg.querySelector('[data-close]').focus();
}

// ---------- workbench events ----------
async function onWorkClick(e) {
  const t = e.target.closest('[data-act],[data-tab],[data-pf],[data-feed],[data-it],[data-sf],[data-fb],[data-pick],[data-agent]');
  if (!t || !S.sim) return;
  const d = t.dataset;
  const sim = S.sim;
  if (d.tab) return setTab(d.tab);
  if (d.pf) { S.personaFilter = d.pf; return renderWork(); }
  if (d.feed) { S.feedMode = d.feed; return renderWork(); }
  if (d.it) { S.interactTab = d.it; return renderWork(); }
  if (d.sf) { S.survey.filter = d.sf; return renderWork(); }
  if (d.fb) { S.fbFilter = d.fb; return renderWork(); }
  if (d.pick) { const id = Number(d.pick); S.survey.picked.has(id) ? S.survey.picked.delete(id) : S.survey.picked.add(id); return renderWork(); }
  if (d.act === 'stop') return Engine.stop();
  if (d.act === 'resume') { S.follow = true; if (resumeSim(sim)) renderWork(); return; }
  if (d.act === 'run') {
    const rerun = simulatedYet(sim.meta) || sim.meta.status === 'paused';
    if (rerun && !(await askConfirm('Start over? This replaces the current simulation and its report.', 'Start over'))) return;
    S.follow = true;
    Engine.start(sim, (ctx) => simulate(ctx, { rounds: S.runRounds }));
    return;
  }
  if (d.act === 'report') {
    if (sim.report.outline && !(await askConfirm('Write a new report? It replaces the current one.', 'Regenerate'))) return;
    S.follow = true;
    Engine.start(sim, generateReport);
    return;
  }
  if (d.act === 'download' || d.act === 'download-pdf') {
    const pdf = d.act === 'download-pdf';
    const label = t.textContent;
    t.disabled = true;
    if (pdf) t.textContent = 'Building PDF…';
    try {
      const data = pdf ? await reportPdf(sim) : reportMarkdownFull(sim);
      await S.downloads.save({ filename: `${clip(sim.meta.name, 60).replace(/[^\w\- ]+/g, '').trim() || 'report'}.${pdf ? 'pdf' : 'md'}`, data });
    } catch (err) { if (err?.code !== 'declined') toast(`Couldn't save the file (${err?.code || err?.message || err}).`); }
    finally { t.disabled = false; t.textContent = label; }
    return;
  }
  if (d.act === 'pick-all') { for (const a of sim.agents || []) if (S.survey.filter === 'all' || a.stance === S.survey.filter) S.survey.picked.add(a.id); return renderWork(); }
  if (d.act === 'pick-none') { S.survey.picked.clear(); return renderWork(); }
  if (d.act?.startsWith('send-')) return sendChat(d.act.slice(5));
  if (d.agent !== undefined) return openPersona(Number(d.agent));
}

function onWorkInput(e) {
  const t = e.target;
  if (t.dataset.draft) S.drafts[t.dataset.draft] = t.value;
  if (t.id === 'run-rounds') { S.runRounds = Number(t.value); $('#run-rounds-v').textContent = S.runRounds; $('#run-est').textContent = runEstimate(); }
  if (t.id === 'agent-select' && e.type === 'change') { S.interviewAgent = Number(t.value); renderWork(); }
}

// =====================================================================
// graph view (d3 force layout; merges updates so the graph grows in place)
// =====================================================================
const G = { svg: null, nodes: [], links: [] };

function initGraph() {
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();
  const root = svg.append('g');
  Object.assign(G, { svg, root, linkG: root.append('g'), nodeG: root.append('g'), nodes: [], links: [] });
  svg.call(d3.zoom().scaleExtent([0.15, 4]).on('zoom', (e) => root.attr('transform', e.transform))).on('dblclick.zoom', null);
  svg.on('click', (e) => { if (e.target === svg.node()) selectNode(null); });
  G.sim = d3.forceSimulation()
    .force('link', d3.forceLink().id((d) => d.id).distance(80).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-240))
    .force('collide', d3.forceCollide().radius((d) => d.r + 10))
    .force('x', d3.forceX().strength(0.05))
    .force('y', d3.forceY().strength(0.05))
    .on('tick', () => {
      G.linkSel?.attr('x1', (d) => d.source.x).attr('y1', (d) => d.source.y).attr('x2', (d) => d.target.x).attr('y2', (d) => d.target.y);
      G.nodeSel?.attr('transform', (d) => `translate(${d.x},${d.y})`);
    });
  centerGraph();
}

function centerGraph() {
  const el = $('#graph');
  if (!el || !G.sim) return;
  const { width, height } = el.getBoundingClientRect();
  G.sim.force('x').x(width / 2);
  G.sim.force('y').y(height / 2);
  G.sim.alpha(0.3).restart();
}

function updateGraph() {
  if (!G.svg || !S.sim) return;
  const graph = graphOf(S.sim) || { nodes: [], edges: [] };
  $('#graph-empty').innerHTML = graph.nodes.length ? '' : `<div><div class="orb" style="margin:0 auto 14px;width:40px;height:40px"></div>${phase(S.sim.meta) === 'prep' ? 'The knowledge graph appears here as Claude reads your material.' : 'No graph.'}</div>`;
  $('#graph-count').textContent = `${graph.nodes.length} entities · ${graph.edges.length} relations`;
  const deg = new Map();
  for (const e of graph.edges) for (const k of [e.source, e.target]) deg.set(k, (deg.get(k) || 0) + 1);
  const old = new Map(G.nodes.map((n) => [n.id, n]));
  const { width, height } = $('#graph').getBoundingClientRect();
  G.nodes = graph.nodes.map((n) => Object.assign(old.get(n.id) || { x: width / 2 + (Math.random() - 0.5) * 160, y: height / 2 + (Math.random() - 0.5) * 160 }, { id: n.id, name: n.name, type: n.type, r: 6 + Math.sqrt(deg.get(n.id) || 0) * 2.6 }));
  G.links = graph.edges.map((e) => ({ id: e.id, source: e.source, target: e.target, type: e.type, fact: e.fact }));
  G.linkSel = G.linkG.selectAll('line').data(G.links, (d) => d.id).join('line').attr('stroke', 'rgba(200,255,235,0.16)').attr('stroke-width', 1.2);
  G.linkSel.selectAll('title').data((d) => [d]).join('title').text((d) => `${d.type}: ${d.fact}`);
  G.nodeSel = G.nodeG.selectAll('g.node').data(G.nodes, (d) => d.id).join((enter) => {
    const g = enter.append('g').attr('class', 'node').style('cursor', 'pointer');
    g.append('circle');
    g.append('text').attr('dy', '0.35em').attr('font-size', 10.5).attr('fill', 'rgba(231,242,238,0.85)').attr('font-family', 'Sora, system-ui, sans-serif').style('pointer-events', 'none');
    g.on('click', (e, d) => { e.stopPropagation(); selectNode(d.id); });
    g.call(d3.drag()
      .on('start', (e, d) => { if (!e.active) G.sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) G.sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    return g;
  });
  G.nodeSel.select('circle').attr('r', (d) => d.r).attr('fill', (d) => typeColor(d.type)).attr('stroke', '#060912').attr('stroke-width', 2);
  G.nodeSel.select('text').attr('x', (d) => d.r + 4).text((d) => clip(d.name, 18));
  G.sim.nodes(G.nodes);
  G.sim.force('link').links(G.links);
  G.sim.alpha(old.size ? 0.35 : 1).restart();
  $('#legend').innerHTML = [...new Set(graph.nodes.map((n) => n.type))].map((t) => `<span class="chip"><span class="dot" style="background:${typeColor(t)}"></span>${esc(t)}</span>`).join('');
  highlight();
}

function selectNode(id) {
  S.selected = id;
  highlight();
  const card = $('#node-card');
  if (id == null) { card.innerHTML = ''; return; }
  const g = graphOf(S.sim);
  const n = g.nodes.find((x) => x.id === id);
  const name = new Map(g.nodes.map((x) => [x.id, x.name]));
  const rels = g.edges.filter((e) => e.source === id || e.target === id);
  const agent = agentsOf(S.sim).find((a) => a.ref === id);
  card.innerHTML = `<div class="card node-card">
    <button class="close" data-x aria-label="Close">✕</button>
    <span class="chip"><span class="dot" style="background:${typeColor(n.type)}"></span>${esc(n.type)}</span>
    <h4>${esc(n.name)}</h4>
    <div class="muted" style="font-size:13px">${esc(n.summary)}</div>
    ${Object.keys(n.attributes || {}).length ? `<div class="tags" style="margin-top:8px">${Object.entries(n.attributes).map(([k, v]) => `<span class="chip mono" style="font-size:11px">${esc(k)}: ${esc(clip(typeof v === 'string' ? v : JSON.stringify(v), 60))}</span>`).join('')}</div>` : ''}
    ${agent ? `<button class="persona st-${agent.stance}" data-agent="${agent.id}" style="margin-top:12px;width:100%"><span class="top"><span class="avatar">${esc(initials(agent.name))}</span><span class="who"><b>Agent @${esc(agent.username)}</b><span>${agent.stance} · open persona</span></span></span></button>` : ''}
    <div class="label" style="margin:14px 0 4px">${rels.length} relations</div>
    ${rels.map((e) => `<div class="rel"><b>${esc(name.get(e.source))}</b> <span class="mono" style="font-size:10.5px">${esc(e.type)}</span> <b>${esc(name.get(e.target))}</b><br>${esc(e.fact)}</div>`).join('')}
  </div>`;
  card.onclick = (e) => {
    if (e.target.closest('[data-x]')) selectNode(null);
    const p = e.target.closest('[data-agent]');
    if (p) openPersona(Number(p.dataset.agent));
  };
}

function highlight() {
  if (!G.nodeSel) return;
  const id = S.selected;
  const end = (v) => (typeof v === 'object' ? v.id : v);
  const near = new Set([id]);
  if (id != null) for (const l of G.links) { if (end(l.source) === id) near.add(end(l.target)); if (end(l.target) === id) near.add(end(l.source)); }
  const touches = (l) => end(l.source) === id || end(l.target) === id;
  G.nodeSel.attr('opacity', (d) => (id == null || near.has(d.id) ? 1 : 0.2));
  G.nodeSel.select('circle').attr('stroke', (d) => (d.id === id ? '#ffffff' : '#060912'));
  G.linkSel.attr('stroke', (l) => (id != null && touches(l) ? 'rgba(62,232,181,0.85)' : 'rgba(200,255,235,0.16)')).attr('opacity', (l) => (id == null || touches(l) ? 1 : 0.15));
}

// boot

booted = Promise.all([
  AI.init().catch(() => {}),
  Store.init().catch(() => {}),
  (async () => { if (window.claude?.use) S.downloads = await claude.use('downloads').catch(() => null); })(),
]);
route();
})();
</script>
