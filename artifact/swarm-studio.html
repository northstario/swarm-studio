    const blocks = batch.map((i) => { const a = agents[i]; return `### agent ${a.id} · @${a.username} — ${a.name} (${a.profession || a.kind}), stance: ${a.stance}\nPersona: ${a.persona}\nWhat they did in the simulation:\n${activityLines(actions, a.id)}`; }).join('\n\n');
    const r = await AI.json(ctx, `${INTERVIEW_PROMPT}\n\n${blocks}\n\n${convo ? `## Conversation so far\n${convo}\n\n` : ''}## Interviewer's question(s)\n${question}`, {
      tier: 'quick', mock: () => ({ answers: batch.map((i) => ({ agent: i, answer: `Demo answer from @${agents[i].username}.` })) }),
    });
    return (Array.isArray(r?.answers) ? r.answers : []).filter((x) => batch.includes(Number(x.agent)));
  }));
  return results.flat().map((x) => { const a = agents[Number(x.agent)]; return { agent_id: a.id, name: a.name, handle: a.username, stance: a.stance, answer: String(x.answer || '') }; });
}

const POLL_PLAN_PROMPT = `You design a short exit poll for a finished social-media simulation, to show what the crowd ended up thinking about the prediction question.
Write:
- question: one closed question (max 18 words) that goes to the heart of the prediction question.
- options: 2-5 short answers that don't overlap (max 6 words each), ordered from most positive to most negative where that makes sense.
- themes: 5-8 short labels (max 5 words each) for the issues people actually argued about in the posts and threads below.
${LANG_RULE}
Reply with only JSON: {"question":"","options":[""],"themes":[""]}`;

const POLL_PROMPT = `You answer an exit poll in character as each of these people, right after a social-media storm they took part in. Each person answers alone, from their own persona, starting stance and what they actually did and saw. They don't know they are simulated.
For each person give:
- vote: the number of the option they choose
- stance: where they stand now on the central development: "supportive", "opposing", "neutral" or "observer"
- sentiment: how they now feel about it, from -1 (hostile) to 1 (enthusiastic)
- themes: the numbers of the 1-2 issues that mattered most to them
- feedback: 1-3 sentences in first person and in their own voice: what they think now and why (max 60 words)
${LANG_RULE}
Reply with only JSON: {"answers":[{"agent":0,"vote":0,"stance":"","sentiment":0,"themes":[0],"feedback":""}]}`;

const POLL_CHUNK = 100;

async function exitPoll(ctx, files, onBatch) {
  const { agents, actions, meta } = ctx.sim;
  const plan = await AI.json(ctx, `${POLL_PLAN_PROMPT}\n\n${files['question.md']}\n\n${clip(files['stats.md'], 9000)}\n\n## Sample of the conversation\n${clip(files['twitter.md'], 6000)}\n\n${clip(files['reddit.md'], 6000)}`, {
    tier: 'default',
    mock: () => ({ question: 'Demo: will the plan succeed?', options: ['Yes, clearly', 'Probably', 'Unsure', 'Probably not'], themes: ['Price', 'Trust', 'Privacy', 'Jobs', 'Timing'] }),
  });
  let options = (Array.isArray(plan.options) ? plan.options : []).map(str).filter(Boolean).slice(0, 5);
  if (options.length < 2) options = ['Yes', 'Unsure', 'No'];
  const themes = (Array.isArray(plan.themes) ? plan.themes : []).map(str).filter(Boolean).slice(0, 8);
  const poll = { question: str(plan.question) || meta.requirement, options, themes, results: [] };
  const seen = (files['stats.md'].match(/## Top microblog[\s\S]*?(?=## Most active)/) || [''])[0];
  const ask = `## Exit poll question\n${poll.question}\nOptions:\n${options.map((o, i) => `${i}. ${o}`).join('\n')}\n\n## Issues people argued about\n${themes.map((t, i) => `${i}. ${t}`).join('\n')}\n\n## What most people saw\n${clip(seen, 5000)}`;
  const batches = groups(agents, BATCH);
  let done = 0;
  let hard = null;
  await Promise.all(batches.map(async (batch) => {
    const blocks = batch.map((a) => `### agent ${a.id} · @${a.username} — ${a.name} (${a.profession || a.kind}), starting stance: ${a.stance}, starting mood: ${a.sentiment.toFixed(1)}\nPersona: ${clip(a.persona, 320)}\nWhat they did:\n${activityLines(actions, a.id)}`).join('\n\n');
    try {
      const r = await AI.json(ctx, `${POLL_PROMPT}\n\n${ask}\n\n${blocks}`, {
        tier: 'quick',
        mock: () => ({ answers: batch.map((a) => ({ agent: a.id, vote: Math.floor(Math.random() * options.length), stance: Math.random() < 0.7 ? a.stance : STANCES[Math.floor(Math.random() * 4)], sentiment: Math.round((Math.random() * 2 - 1) * 100) / 100, themes: [Math.floor(Math.random() * themes.length)], feedback: `Demo feedback from @${a.username}: what I think now and why.` })) }),
      });
      const ids = new Set(batch.map((a) => a.id));
      for (const x of Array.isArray(r?.answers) ? r.answers : []) {
        const id = Number(x.agent);
        if (!ids.delete(id)) continue;
        const v = Number(x.vote);
        poll.results.push({
          agent: id,
          vote: Number.isInteger(v) && v >= 0 && v < options.length ? v : null,
          stance: STANCES.includes(x.stance) ? x.stance : agents[id].stance,
          sentiment: x.sentiment != null && Number.isFinite(Number(x.sentiment)) ? num(x.sentiment, -1, 1, 0) : null,
          themes: [...new Set((Array.isArray(x.themes) ? x.themes : []).map(Number).filter((t) => Number.isInteger(t) && t >= 0 && t < themes.length))].slice(0, 2),
          feedback: clip(str(x.feedback), 420),
        });
      }
    } catch (e) {
      if (e.code === 'cancelled' || HARD.includes(e.code)) hard ||= e;
      else ctx.log(`Exit poll batch failed (${e.code || e.message})`, 'warn');
    }
    onBatch(++done, batches.length);
  }));
  if (hard) throw hard;
  poll.results.sort((a, b) => a.agent - b.agent);
  return poll;
}

function pollMarkdown(sim) {
  const { question, options, themes, results } = sim.report.poll;
  const agents = sim.agents;
  const n = results.length;
  const pct = (k) => `${k} (${Math.round((100 * k) / n)}%)`;
  const votes = options.map((o, i) => `- ${o}: ${pct(results.filter((r) => r.vote === i).length)}`).join('\n');
  const shift = STANCES.map((s) => `- ${s}: ${results.filter((r) => agents[r.agent].stance === s).length} at start → ${results.filter((r) => r.stance === s).length} now`).join('\n');
  const issues = themes.map((t, i) => [t, results.filter((r) => r.themes.includes(i)).length]).sort((a, b) => b[1] - a[1]).map(([t, k]) => `- ${t}: ${k}`).join('\n');
  const changed = results.filter((r) => r.stance !== agents[r.agent].stance).length;
  return `# Exit poll of every agent after the simulation
Question: ${question}
Answered: ${n} of ${agents.length} agents

## Votes
${votes}

## Stance at start → now
${shift}
- changed their stance: ${pct(changed)}

## Issues that mattered most
${issues}

## Every answer
${results.map((r) => { const a = agents[r.agent]; return `- @${a.username} (${a.name}, ${a.stance} → ${r.stance}, voted "${options[r.vote] ?? 'no answer'}", mood ${a.sentiment.toFixed(1)} → ${r.sentiment == null ? '?' : r.sentiment.toFixed(1)}): ${r.feedback}`; }).join('\n')}
`;
}

async function savePoll(sim) {
  const lists = groups(sim.report.poll.results, POLL_CHUNK);
  await Promise.all(lists.map((list, i) => Store.put(part(sim.meta.id, `poll-${i}`), { list })));
}

const PLAN_PROMPT = `You plan a prediction report about a simulated future. A swarm of AI agents, representing the real actors and the public, reacted to a situation on simulated social platforms. The simulation is a rehearsal of how things could unfold, seen from a god's-eye view.
Plan a report that answers the prediction question with what happened in the simulation: how opinion formed and shifted, who drove it, which arguments won, what risks and turning points appeared, and what it suggests will happen.
2-5 sections, no subsections. Each has a title and a focus (one sentence on what it covers and which evidence it will use).
Also write 3-5 takeaways: one sentence each, the headline findings a busy reader needs, each carrying a number from the stats or the exit poll.
${LANG_RULE}
Reply with only JSON: {"title":"","summary":"","takeaways":[""],"sections":[{"title":"","focus":""}]}`;

const PICK_PROMPT = `You choose who to interview after a social-media simulation, for a prediction report. Pick 5-8 agents with different stances and kinds, including the most influential and the most active. Write 3-4 short open questions (max 20 words each) about the prediction question.
${LANG_RULE}
Reply with only JSON: {"agent_ids":[0],"questions":[""]}`;

const SECTION_PROMPT = `You write one section of a prediction report about a simulated social-media world. The evidence is in files you can search with the grep, read_file and list_files tools:
- question.md: the prediction question, situation and settings
- stats.md: totals, stance mix, top posts, most active and most followed agents, activity per round
- agents.md: every agent with handle, kind, role, stance, influence and activity
- twitter.md: every microblog post in order, with engagement
- reddit.md: every forum thread with its comments and scores
- interviews.md: post-simulation interviews with selected agents
- poll.md: exit poll of every agent: votes, stance now against at the start, mood, the issues that mattered, and each agent's own words
- graph.md: the knowledge graph from the source documents

Work like an analyst: make 3-6 tool calls to gather evidence for this section, then write it.
Rules:
- Every claim must come from the evidence files. Never invent agents, posts, numbers or quotes.
- Quote agents verbatim as blockquotes that name them: > "..." — @handle (microblog or forum)
- Use numbers from stats.md where they help.
- No markdown headings; use **bold** lead-ins instead. 250-600 words.
- Don't repeat what earlier sections said.
- Write nothing while you research. Put the finished section, and nothing else, between <section> and </section>.
${LANG_RULE}`;

const CHAT_PROMPT = `You are the report agent for a finished social-media simulation. Answer the user's question concisely, grounded in the evidence files (report.md if present, stats.md, poll.md, agents.md, twitter.md, reddit.md, interviews.md, graph.md, question.md), which you can search with the grep and read_file tools. Use 0-3 tool calls as needed. Quote agents as > blockquotes with their @handle. Never invent facts. Write nothing while you research; put the final answer between <answer> and </answer>.
${LANG_RULE}`;

const between = (text, tag) => {
  const open = text.lastIndexOf(`<${tag}>`);
  if (open < 0) return null;
  const rest = text.slice(open + tag.length + 2);
  const close = rest.indexOf(`</${tag}>`);
  return (close < 0 ? rest : rest.slice(0, close)).trim();
};

function reportMarkdown(sim) {
  const r = sim.report;
  return `# ${r.outline.title}\n\n> ${r.outline.summary}\n\n${r.outline.sections.map((s, i) => `## ${s.title}\n\n${r.sections[i] || ''}`).join('\n\n')}\n`;
}

async function generateReport(ctx, { resume = false } = {}) {
  const sim = ctx.sim;
  const m = sim.meta;
  const t0 = Date.now();
  const pollHead = (p) => p && { question: p.question, options: p.options, themes: p.themes, chunks: Math.ceil(p.results.length / POLL_CHUNK) };
  const saveReport = () => Store.put(part(m.id, 'report'), { ...sim.report, poll: pollHead(sim.report.poll), log: sim.report.log.slice(-160) });
  const log = (ev) => {
    const row = { t: Number(((Date.now() - t0) / 1000).toFixed(1)), ...ev };
    sim.report.log.push(row);
    ctx.emit('report', row);
  };
  const kept = resume && sim.report.poll?.results?.length ? sim.report.poll : null;
  ctx.set({ status: 'reporting', stage: 'report', progress: 2, message: kept ? 'Planning the report' : 'Running the exit poll', error: null, resume: null }, true);
  sim.report = emptyReport();
  let files = buildEvidence(sim);
  if (kept) sim.report.poll = kept;
  else {
    log({ kind: 'poll_start', agents: sim.agents.length });
    sim.report.poll = await exitPoll(ctx, files, (d, n) => ctx.set({ progress: 2 + Math.round((d / n) * 28), message: `Exit poll · ${d} of ${n} batches` }));
    log({ kind: 'poll', answered: sim.report.poll.results.length, question: sim.report.poll.question });
    await savePoll(sim);
    await saveReport();
  }
  files = buildEvidence(sim);
  ctx.set({ progress: 31, message: 'Planning the report' });
  log({ kind: 'plan_start' });
  const o = await AI.json(ctx, `${PLAN_PROMPT}\n\n${files['question.md']}\n\n${clip(files['stats.md'], 14000)}${files['poll.md'] ? `\n\n${clip(files['poll.md'].split('## Every answer')[0], 4000)}` : ''}`, {
    tier: 'default',
    mock: () => ({ title: 'Demo prediction report', summary: 'Demo summary.', takeaways: ['Demo takeaway one with a number: 42%.', 'Demo takeaway two.'], sections: [{ title: 'How it started', focus: 'opening' }, { title: 'Who drove it', focus: 'actors' }, { title: 'What happens next', focus: 'outlook' }] }),
  });
  const outline = {
    title: str(o.title) || 'Prediction report',
    summary: str(o.summary),
    takeaways: (Array.isArray(o.takeaways) ? o.takeaways : []).map(str).filter(Boolean).slice(0, 5),
    sections: (Array.isArray(o.sections) ? o.sections : []).filter((s) => s.title).slice(0, 5).map((s) => ({ title: str(s.title), focus: str(s.focus) })),
  };
  if (outline.sections.length < 2) outline.sections = [{ title: 'What happened', focus: 'Overall dynamics' }, { title: 'What it suggests', focus: 'Outlook and risks' }];
  sim.report.outline = outline;
  log({ kind: 'plan', outline });
  await saveReport();

  ctx.set({ progress: 36, message: 'Interviewing agents' });
  const pick = await AI.json(ctx, `${PICK_PROMPT}\n\n${files['question.md']}\n\n${clip(files['agents.md'], 20000)}`, {
    tier: 'default', mock: () => ({ agent_ids: [0, 1, 2], questions: ['How do you feel about how this played out?'] }),
  });
  const questions = (Array.isArray(pick.questions) ? pick.questions : []).map(str).filter(Boolean).slice(0, 4);
  const ids = (Array.isArray(pick.agent_ids) ? pick.agent_ids : []).map(Number).filter((i) => sim.agents[i]).slice(0, 8);
  log({ kind: 'tool_call', tool: 'interview_agents', input: { agent_ids: ids, questions } });
  const answers = questions.length && ids.length ? await interview(ctx, ids, questions.map((q, i) => `${i + 1}. ${q}`).join('\n')) : [];
  sim.report.interviews = `# Post-simulation interviews\nQuestions:\n${questions.map((q, i) => `${i + 1}. ${q}`).join('\n')}\n\n${answers.map((a) => `## @${a.handle} — ${a.name} (${a.stance})\n${a.answer}`).join('\n\n')}\n`;
  files['interviews.md'] = sim.report.interviews;
  log({ kind: 'tool_result', tool: 'interview_agents', preview: answers.map((a) => `@${a.handle}: ${clip(a.answer, 140)}`).join('\n') });
  await saveReport();

  for (const [i, s] of outline.sections.entries()) {
    ctx.set({ progress: 42 + Math.round((i / outline.sections.length) * 56), message: `Writing "${s.title}"` });
    log({ kind: 'section_start', section: i, title: s.title });
    const prev = sim.report.sections.map((d, k) => `### ${outline.sections[k].title}\n${clip(d, 1500)}`).join('\n\n');
    const text = await AI.agent(ctx, `${SECTION_PROMPT}\n\nReport: ${outline.title}\nSummary: ${outline.summary}\nOutline:\n${outline.sections.map((x, k) => `${k + 1}. ${x.title} — ${x.focus}`).join('\n')}\n\n${prev ? `## Sections already written\n${prev}\n\n` : ''}## Write section ${i + 1}: ${s.title}\nFocus: ${s.focus}`, {
      files,
      onTool: (tool, input, result) => { log({ kind: 'tool_call', tool, input, section: i }); log({ kind: 'tool_result', tool, preview: clip(result, 600), section: i }); },
      onText: ({ text: t }) => { const body = between(t, 'section'); if (body != null) { sim.report.live = { section: i, text: body }; ctx.emit('stream'); } },
      mock: () => `<section>**Demo finding.** Placeholder text for "${s.title}".\n\n> "Demo quote." — @agent (microblog)</section>`,
    });
    sim.report.live = null;
    sim.report.sections[i] = (between(text, 'section') ?? text).replace(/^#+\s.*\n/gm, '').trim();
    log({ kind: 'section_done', section: i, title: s.title });
    await saveReport();
  }
  log({ kind: 'done' });
  await saveReport();
  ctx.set({ status: 'reported', stage: 'reported', progress: 100, message: 'Report ready' }, true);
}

async function chat(ctx, message, history) {
  const convo = history.slice(-10).map((x) => `${x.role === 'user' ? 'User' : 'You'}: ${x.content}`).join('\n\n');
  const text = await AI.agent(ctx, `${CHAT_PROMPT}\n\n${convo ? `## Conversation so far\n${convo}\n\n` : ''}## User's question\n${message}`, {
    files: buildEvidence(ctx.sim),
    onTool: (tool, input) => ctx.emit('chat', { tool, input }),
    mock: () => `<answer>Demo answer to: ${message}</answer>`,
  });
  return between(text, 'answer') ?? text;
}

// =====================================================================
// visual report: numbers, charts (SVG strings) and the .md / .pdf exports
// =====================================================================
const STANCE_ORDER = ['supportive', 'neutral', 'observer', 'opposing'];
const STANCE_LABEL = { supportive: 'Supportive', neutral: 'Neutral', observer: 'Observer', opposing: 'Opposing' };
const PLATFORM_LABEL = { twitter: 'Microblog', reddit: 'Forum' };
const ACTION_LABEL = {
  'twitter CREATE_POST': 'Microblog posts', 'twitter LIKE_POST': 'Likes', 'twitter REPOST': 'Reposts', 'twitter QUOTE_POST': 'Quote posts', 'twitter FOLLOW': 'Follows (microblog)',
  'reddit CREATE_POST': 'Forum threads', 'reddit CREATE_COMMENT': 'Forum comments', 'reddit LIKE_POST': 'Thread upvotes', 'reddit DISLIKE_POST': 'Thread downvotes',
  'reddit LIKE_COMMENT': 'Comment upvotes', 'reddit DISLIKE_COMMENT': 'Comment downvotes', 'reddit FOLLOW': 'Follows (forum)', 'reddit MUTE': 'Mutes',
};
// Chart colours were checked with the dataviz palette validator (stance and platform sets, both modes). Neutral is the grey midpoint on purpose.
const VIZ = {
  dark: { hover: true, font: 'Sora, system-ui, sans-serif', mono: "'IBM Plex Mono', monospace", ink: '#e7f2ee', ink2: '#9db3ae', ink3: '#67807b', grid: 'rgba(200,255,235,0.12)', ring: '#0e131b',
    stance: { supportive: '#5b9a1a', neutral: '#6b7585', observer: '#9085e9', opposing: '#e66767' }, platform: { twitter: '#3987e5', reddit: '#d95926' }, one: '#2dd4bf', safe: (s) => String(s ?? '') },
  light: { font: 'Helvetica, Arial, sans-serif', mono: 'Helvetica, Arial, sans-serif', ink: '#10201b', ink2: '#4b5d58', ink3: '#7a8a86', grid: '#e1e7e5', ring: '#ffffff', bg: '#ffffff',
    stance: { supportive: '#3f8a3a', neutral: '#8b939f', observer: '#6250d6', opposing: '#e34948' }, platform: { twitter: '#2a78d6', reddit: '#eb6834' }, one: '#0f8f84', safe: (s) => String(s ?? '') },
};
// jsPDF's built-in fonts only cover Latin-1, so PDF text is mapped down to it.
const pdfSafe = (s) => String(s ?? '').normalize('NFC')
  .replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"')
  .replace(/[‐-―−]/g, '-').replace(/…/g, '...').replace(/[•●]/g, '-')
  .replace(/→/g, '->').replace(/[  ]/g, ' ').replace(/[^\x00-\xFF]/gu, '');
VIZ.pdf = { ...VIZ.light, font: 'helvetica, sans-serif', mono: 'helvetica, sans-serif', safe: pdfSafe };

const r1 = (v) => Math.round(v * 10) / 10;
const fmtN = (n) => (n >= 10000 ? `${(n / 1000).toFixed(1)}K` : Number(n).toLocaleString('en-US'));
const pctOf = (k, n) => (n ? `${Math.round((100 * k) / n)}%` : '0%');
const signed = (v) => (v == null ? '–' : `${v > 0 ? '+' : ''}${v.toFixed(2)}`);
const cell = (c) => (c == null ? '–' : typeof c === 'number' ? (Number.isInteger(c) ? String(c) : c.toFixed(2)) : c);
const sumParts = (r) => Object.values(r.parts).reduce((s, v) => s + v, 0);
const lum = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
};
const inkOn = (hex) => (lum(hex) > 0.19 ? '#0b0f14' : '#ffffff');
const rgbOf = (hex) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };

const svgOpen = (th, w, h, label) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${r1(h)}" width="${w}" height="${r1(h)}" role="img" aria-label="${esc(th.safe(label))}" font-family="${th.font}">${th.bg ? `<rect width="${w}" height="${r1(h)}" fill="${th.bg}"/>` : ''}`;
const tx = (th, x, y, s, { size = 12, fill, anchor = 'start', bold = false, mono = false } = {}) =>
  `<text x="${r1(x)}" y="${r1(y)}" font-size="${size}" fill="${fill || th.ink2}" text-anchor="${anchor}" font-weight="${bold ? 'bold' : 'normal'}"${mono ? ` font-family="${th.mono}"` : ''}>${esc(th.safe(s))}</text>`;
const tip = (th, s) => (th.hover ? `<title>${esc(th.safe(s))}</title>` : '');
// Bar with a 4px rounded data end and a square baseline; column likewise, rounded on top.
const barR = (x, y, w, h, r = 4) => { r = Math.min(r, w / 2, h / 2); return `M${r1(x)},${r1(y)}h${r1(w - r)}a${r},${r} 0 0 1 ${r},${r}v${r1(h - 2 * r)}a${r},${r} 0 0 1 -${r},${r}h${r1(r - w)}z`; };
const colR = (x, y, w, h, r = 4) => { r = Math.min(r, w / 2, h); return `M${r1(x)},${r1(y + h)}v${r1(r - h)}a${r},${r} 0 0 1 ${r},-${r}h${r1(w - 2 * r)}a${r},${r} 0 0 1 ${r},${r}v${r1(h - r)}z`; };
const niceMax = (v) => { const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };

function wrapLabel(s, max, lines = 2) {
  const out = [];
  let cur = '';
  for (const w of String(s).split(/\s+/).filter(Boolean)) {
    if (cur && `${cur} ${w}`.length > max) { out.push(cur); cur = w; } else cur = cur ? `${cur} ${w}` : w;
  }
  if (cur) out.push(cur);
  if (out.length > lines) out.splice(lines - 1, out.length, out.slice(lines - 1).join(' '));
  return out.map((l) => clip(l, max + 1));
}

function legend(th, items, w) {
  let x = 0;
  let row = 0;
  let out = '';
  for (const it of items) {
    const width = 30 + th.safe(it.label).length * 6.6;
    if (x > 0 && x + width > w) { x = 0; row++; }
    const y = 2 + row * 18;
    out += it.hollow
      ? `<circle cx="${x + 5}" cy="${y + 5}" r="4" fill="${th.ring}" stroke="${it.color}" stroke-width="2"/>`
      : it.dot ? `<circle cx="${x + 5}" cy="${y + 5}" r="5" fill="${it.color}"/>` : `<rect x="${x}" y="${y}" width="10" height="10" rx="3" fill="${it.color}"/>`;
    out += tx(th, x + 15, y + 9.5, it.label, { size: 11.5 });
    x += width;
  }
  return { svg: out, h: (row + 1) * 18 + 8 };
}

// Horizontal bars: one series, stacked series, or (pct) one tall segmented bar per row.
function svgBars(th, w, { rows, keys, pct = false, label }) {
  const lg = keys.length > 1 ? legend(th, keys, w) : { svg: '', h: 0 };
  const labelW = Math.round(w * 0.34);
  const valW = pct ? 0 : 44;
  const barW = w - labelW - valW - 6;
  const rowH = pct ? 40 : 34;
  const thick = pct ? 26 : 16;
  const max = Math.max(1, ...rows.map(sumParts));
  let out = svgOpen(th, w, lg.h + rows.length * rowH + 2, label || '') + lg.svg;
  rows.forEach((r, i) => {
    const y0 = lg.h + i * rowH;
    const total = sumParts(r);
    const lines = wrapLabel(r.label, Math.floor(labelW / 6.8), 2);
    lines.forEach((l, k) => { out += tx(th, 0, y0 + rowH / 2 + 4 + (k - (lines.length - 1) / 2) * 13, l, { fill: th.ink }); });
    const scale = pct ? (total ? barW / total : 0) : barW / max;
    const segs = keys.map((k) => [k, r.parts[k.key] || 0]).filter(([, v]) => v > 0);
    const by = y0 + (rowH - thick) / 2;
    let x = labelW;
    segs.forEach(([k, v], j) => {
      const full = v * scale;
      const width = Math.max(1, full - (j < segs.length - 1 ? 2 : 0));
      const share = pctOf(v, total);
      const t = tip(th, `${r.label} · ${k.label}: ${v}${keys.length > 1 ? ` (${share})` : ''}`);
      if (pct) out += `<rect x="${r1(x)}" y="${r1(by)}" width="${r1(width)}" height="${thick}" rx="4" fill="${k.color}">${t}</rect>`;
      else if (j === segs.length - 1) out += `<path d="${barR(x, by, width, thick)}" fill="${k.color}">${t}</path>`;
      else out += `<rect x="${r1(x)}" y="${r1(by)}" width="${r1(width)}" height="${thick}" fill="${k.color}">${t}</rect>`;
      if (pct && width > 38) out += tx(th, x + 6, by + thick / 2 + 4, share, { size: 11.5, fill: inkOn(k.color), bold: true });
      x += full;
    });
    if (!pct) out += tx(th, labelW + total * scale + 6, y0 + rowH / 2 + 4, fmtN(total), { fill: th.ink, mono: true });
  });
  return `${out}</svg>`;
}

// Stacked columns, one per category (here: per round).
function svgColumns(th, w, { rows, keys, label }) {
  const lg = legend(th, keys, w);
  const left = 36;
  const top = lg.h + 8;
  const plotH = 150;
  const h = top + plotH + 24;
  const max = niceMax(Math.max(1, ...rows.map(sumParts)));
  const yOf = (v) => top + plotH - (v / max) * plotH;
  let out = svgOpen(th, w, h, label || '') + lg.svg;
  for (const v of [0, max / 2, max]) {
    out += `<line x1="${left}" x2="${w}" y1="${r1(yOf(v))}" y2="${r1(yOf(v))}" stroke="${th.grid}" stroke-width="1"/>`;
    out += tx(th, left - 6, yOf(v) + 4, fmtN(Math.round(v * 10) / 10), { size: 10.5, anchor: 'end', fill: th.ink3, mono: true });
  }
  const band = (w - left) / Math.max(1, rows.length);
  const cw = Math.min(24, band * 0.72);
  const every = Math.ceil(rows.length / 8);
  rows.forEach((r, i) => {
    const x = left + i * band + (band - cw) / 2;
    const segs = keys.map((k) => [k, r.parts[k.key] || 0]).filter(([, v]) => v > 0);
    let base = 0;
    segs.forEach(([k, v], j) => {
      const y1 = yOf(base + v);
      const hh = Math.max(1, yOf(base) - y1 - (j < segs.length - 1 ? 2 : 0));
      const y = j < segs.length - 1 ? y1 + 2 : y1;
      out += j === segs.length - 1 ? `<path d="${colR(x, y, cw, hh)}" fill="${k.color}"/>` : `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(cw)}" height="${r1(hh)}" fill="${k.color}"/>`;
      base += v;
    });
    if (th.hover) out += `<rect x="${r1(left + i * band)}" y="${top}" width="${r1(band)}" height="${plotH}" fill="transparent">${tip(th, `Round ${r.label}: ${keys.map((k) => `${k.label} ${r.parts[k.key] || 0}`).join(', ')}`)}</rect>`;
    if (i % every === 0 || i === rows.length - 1) out += tx(th, x + cw / 2, top + plotH + 16, `R${r.label}`, { size: 10.5, anchor: 'middle', fill: th.ink3, mono: true });
  });
  return `${out}</svg>`;
}

// Lines on a fixed -1..1 scale (sentiment), x = round.
function svgLines(th, w, { series, xMax, label }) {
  const lg = legend(th, series, w);
  const left = 36;
  const right = 10;
  const top = lg.h + 8;
  const plotH = 150;
  const h = top + plotH + 24;
  const xOf = (r) => left + (xMax > 1 ? ((r - 1) / (xMax - 1)) * (w - left - right) : (w - left - right) / 2);
  const yOf = (v) => top + ((1 - v) / 2) * plotH;
  let out = svgOpen(th, w, h, label || '') + lg.svg;
  for (const v of [1, 0.5, 0, -0.5, -1]) {
    out += `<line x1="${left}" x2="${w - right}" y1="${r1(yOf(v))}" y2="${r1(yOf(v))}" stroke="${v === 0 ? th.ink3 : th.grid}" stroke-width="1"/>`;
    out += tx(th, left - 6, yOf(v) + 4, v > 0 ? `+${v}` : String(v), { size: 10.5, anchor: 'end', fill: th.ink3, mono: true });
  }
  const every = Math.max(1, Math.ceil(xMax / 8));
  for (let r = 1; r <= xMax; r += every) out += tx(th, xOf(r), top + plotH + 16, `R${r}`, { size: 10.5, anchor: 'middle', fill: th.ink3, mono: true });
  for (const s of series) {
    if (!s.pts.length) continue;
    out += `<path d="${s.pts.map(([r, v], i) => `${i ? 'L' : 'M'}${r1(xOf(r))},${r1(yOf(v))}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (th.hover) for (const [r, v, n] of s.pts) out += `<circle cx="${r1(xOf(r))}" cy="${r1(yOf(v))}" r="7" fill="transparent">${tip(th, `${s.label}, round ${r}: ${signed(v)} across ${n} posts`)}</circle>`;
    const [lr, lv] = s.pts.at(-1);
    out += `<circle cx="${r1(xOf(lr))}" cy="${r1(yOf(lv))}" r="4" fill="${s.color}" stroke="${th.ring}" stroke-width="2"/>`;
  }
  return `${out}</svg>`;
}

// Dumbbell rows: start value (hollow) to end value (filled) on -1..1.
function svgDumbbell(th, w, { rows, label }) {
  const lg = legend(th, [{ label: 'At the start', color: th.ink3, hollow: true }, { label: 'After the run', color: th.ink2, dot: true }], w);
  const left = 96;
  const right = 40;
  const rowH = 32;
  const top = lg.h + 4;
  const h = top + rows.length * rowH + 26;
  const xOf = (v) => left + ((v + 1) / 2) * (w - left - right);
  let out = svgOpen(th, w, h, label || '') + lg.svg;
  for (const v of [-1, 0, 1]) {
    out += `<line x1="${r1(xOf(v))}" x2="${r1(xOf(v))}" y1="${top}" y2="${top + rows.length * rowH}" stroke="${v === 0 ? th.ink3 : th.grid}" stroke-width="1"/>`;
    out += tx(th, xOf(v), top + rows.length * rowH + 16, v === -1 ? '-1 hostile' : v === 1 ? '+1 keen' : '0', { size: 10.5, anchor: v === -1 ? 'start' : v === 1 ? 'end' : 'middle', fill: th.ink3, mono: true });
  }
  rows.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2;
    out += tx(th, 0, y + 4, `${r.label} (${r.n})`, { fill: th.ink });
    out += `<line x1="${r1(xOf(r.a))}" x2="${r1(xOf(r.b))}" y1="${r1(y)}" y2="${r1(y)}" stroke="${r.color}" stroke-width="2" stroke-opacity="0.55"/>`;
    out += `<circle cx="${r1(xOf(r.a))}" cy="${r1(y)}" r="4.5" fill="${th.ring}" stroke="${th.ink3}" stroke-width="2">${tip(th, `${r.label} at the start: ${signed(r.a)}`)}</circle>`;
    out += `<circle cx="${r1(xOf(r.b))}" cy="${r1(y)}" r="5.5" fill="${r.color}" stroke="${th.ring}" stroke-width="2">${tip(th, `${r.label} after the run: ${signed(r.b)}`)}</circle>`;
    const toRight = r.b >= r.a;
    out += tx(th, xOf(r.b) + (toRight ? 10 : -10), y + 4, signed(r.b), { size: 11, anchor: toRight ? 'start' : 'end', fill: th.ink, mono: true });
  });
  return `${out}</svg>`;
}

function reportData(sim) {
  const { agents, actions, meta, report } = sim;
  const key = `${actions.length}|${report.poll?.results?.length || 0}|${agents.length}`;
  if (sim.viz?.key === key) return sim.viz.data;
  const world = rebuildWorld(sim).state;
  const poll = report.poll?.results?.length ? report.poll : null;
  const avg = (xs) => (xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null);
  const c = countsOf(actions);
  const byType = new Map();
  const perRound = new Map();
  const acted = new Map();
  const toned = [];
  for (const a of actions) {
    const k = `${a.platform} ${a.action}`;
    byType.set(k, (byType.get(k) || 0) + 1);
    acted.set(a.agent_id, (acted.get(a.agent_id) || 0) + 1);
    if (a.round > 0) { const p = perRound.get(a.round) || { twitter: 0, reddit: 0 }; p[a.platform]++; perRound.set(a.round, p); }
    if (typeof a.sentiment === 'number') toned.push(a);
  }
  const reactions = actions.filter((a) => /LIKE|REPOST/.test(a.action)).length;
  const d = { poll, kpis: [] };
  d.kpis.push({ label: 'Agents', value: fmtN(agents.length), note: `${agents.filter((a) => a.ref).length} from the material` });
  d.kpis.push({ label: 'Posts and comments', value: fmtN(c.posts + c.comments), note: `over ${meta.sim?.round ?? 0} rounds` });
  d.kpis.push({ label: 'Reactions', value: fmtN(reactions), note: 'likes, votes, reposts' });
  if (toned.length) d.kpis.push({ label: 'Average tone', value: signed(avg(toned.map((a) => a.sentiment))), note: '-1 negative to +1 positive' });
  if (poll) {
    const res = poll.results;
    const counts = poll.options.map((o, i) => [o, res.filter((r) => r.vote === i).length]).sort((a, b) => b[1] - a[1]);
    const changed = res.filter((r) => r.stance !== agents[r.agent].stance).length;
    d.kpis.push({ label: 'Top answer', value: pctOf(counts[0][1], res.length), note: counts[0][0] });
    d.kpis.push({ label: 'Changed their mind', value: pctOf(changed, res.length), note: `${changed} of ${res.length} agents` });
    const byStance = (pred) => Object.fromEntries(STANCE_ORDER.map((s) => [s, res.filter((r) => pred(r, s)).length]));
    d.vote = { question: poll.question, rows: poll.options.map((o, i) => ({ label: o, parts: byStance((r, s) => r.vote === i && r.stance === s) })) };
    d.shift = [
      { label: 'At the start', parts: byStance((r, s) => agents[r.agent].stance === s) },
      { label: 'After the run', parts: byStance((r, s) => r.stance === s) },
    ];
    d.mood = STANCE_ORDER.map((s) => {
      const g = res.filter((r) => agents[r.agent].stance === s && r.sentiment != null);
      return { stance: s, n: g.length, a: avg(g.map((r) => agents[r.agent].sentiment)), b: avg(g.map((r) => r.sentiment)) };
    }).filter((r) => r.n);
    d.themes = poll.themes.map((t, i) => ({ label: t, n: res.filter((r) => r.themes.includes(i)).length })).sort((a, b) => b.n - a.n);
    d.feedback = res.map((r) => {
      const a = agents[r.agent];
      return { id: a.id, name: a.name, handle: a.username, role: a.profession || a.kind, from: a.stance, to: r.stance, vote: r.vote, voteLabel: poll.options[r.vote] ?? 'No answer', m0: a.sentiment, m1: r.sentiment, themes: r.themes.map((i) => poll.themes[i]), text: r.feedback, acted: acted.get(a.id) || 0, influence: a.influence };
    }).sort((x, y) => y.influence - x.influence || y.acted - x.acted);
  }
  d.xMax = Math.max(0, ...perRound.keys());
  d.activity = Array.from({ length: d.xMax }, (_, i) => ({ label: String(i + 1), parts: perRound.get(i + 1) || { twitter: 0, reddit: 0 } }));
  if (toned.length) {
    d.tone = PLATFORMS.map((p) => {
      const byR = new Map();
      for (const a of toned) if (a.platform === p) { const v = byR.get(a.round) || [0, 0]; v[0] += a.sentiment; v[1]++; byR.set(a.round, v); }
      return { key: p, pts: [...byR.entries()].sort((a, b) => a[0] - b[0]).map(([r, [s, n]]) => [r, s / n, n]) };
    }).filter((s) => s.pts.length);
  }
  d.mix = [...byType.entries()].map(([k, n]) => ({ label: ACTION_LABEL[k] || k, n })).sort((a, b) => b.n - a.n).slice(0, 8);
  const eng = (p) => p.likes + 2 * p.reposts + 2 * p.quotes;
  const who = (i) => ({ id: i, name: agents[i].name, handle: agents[i].username, stance: agents[i].stance });
  d.topTw = world.twitter.filter((p) => !p.repost_of).sort((a, b) => eng(b) - eng(a)).slice(0, 3)
    .map((p) => ({ ...who(p.author), content: p.content, stat: `${p.likes} likes · ${p.reposts} reposts · ${p.quotes} quotes` }));
  d.topRd = [...world.reddit].sort((a, b) => b.score + b.comments.length - (a.score + a.comments.length)).slice(0, 3)
    .map((p) => ({ ...who(p.author), title: p.title, content: p.content, stat: `score ${p.score} · ${p.comments.length} comments` }));
  sim.viz = { key, data: d };
  return d;
}

function chartSpecs(d) {
  const sk = (th) => STANCE_ORDER.map((s) => ({ key: s, label: STANCE_LABEL[s], color: th.stance[s] }));
  const specs = [];
  const stanceHead = STANCE_ORDER.map((s) => STANCE_LABEL[s]);
  if (d.vote) specs.push({ title: 'How the crowd voted', sub: `Exit poll: ${d.vote.question}`, svg: (th, w) => svgBars(th, w, { rows: d.vote.rows, keys: sk(th), label: 'Exit poll votes by stance' }),
    table: { head: ['Answer', ...stanceHead, 'Total'], rows: d.vote.rows.map((r) => [r.label, ...STANCE_ORDER.map((s) => r.parts[s]), sumParts(r)]) } });
  if (d.shift) specs.push({ title: 'Stance before and after', sub: 'Share of agents on each side at the start and in the exit poll', svg: (th, w) => svgBars(th, w, { rows: d.shift, keys: sk(th), pct: true, label: 'Stance at the start and after the run' }),
    table: { head: ['', ...stanceHead], rows: d.shift.map((r) => [r.label, ...STANCE_ORDER.map((s) => r.parts[s])]) } });
  if (d.tone?.length) {
    const rounds = [...new Set(d.tone.flatMap((s) => s.pts.map((p) => p[0])))].sort((a, b) => a - b);
    const at = (key, r) => d.tone.find((s) => s.key === key)?.pts.find((p) => p[0] === r)?.[1] ?? null;
    specs.push({ title: 'Tone of posts over the run', sub: 'Average sentiment of new posts and comments per round, from -1 negative to +1 positive',
      svg: (th, w) => svgLines(th, w, { series: d.tone.map((s) => ({ label: PLATFORM_LABEL[s.key], color: th.platform[s.key], pts: s.pts })), xMax: d.xMax, label: 'Tone of posts per round' }),
      table: { head: ['Round', 'Microblog', 'Forum'], rows: rounds.map((r) => [r, at('twitter', r), at('reddit', r)]) } });
  }
  if (d.mood?.length) specs.push({ title: 'Mood shift by starting stance', sub: 'Average mood of each group at the start against the exit poll', svg: (th, w) => svgDumbbell(th, w, { rows: d.mood.map((r) => ({ label: STANCE_LABEL[r.stance], color: th.stance[r.stance], a: r.a, b: r.b, n: r.n })), label: 'Mood at the start and after the run' }),
    table: { head: ['Starting stance', 'Agents', 'Mood at start', 'Mood after'], rows: d.mood.map((r) => [STANCE_LABEL[r.stance], r.n, r.a, r.b]) } });
  if (d.themes?.length) specs.push({ title: 'Issues that mattered most', sub: 'Agents naming each issue in the exit poll (up to two each)', svg: (th, w) => svgBars(th, w, { rows: d.themes.map((t) => ({ label: t.label, parts: { n: t.n } })), keys: [{ key: 'n', label: 'Agents', color: th.one }], label: 'Issues named in the exit poll' }),
    table: { head: ['Issue', 'Agents'], rows: d.themes.map((t) => [t.label, t.n]) } });
  if (d.activity.length) specs.push({ title: 'Activity per round', sub: 'Actions on each platform per round, idle turns left out', svg: (th, w) => svgColumns(th, w, { rows: d.activity, keys: PLATFORMS.map((p) => ({ key: p, label: PLATFORM_LABEL[p], color: th.platform[p] })), label: 'Actions per round' }),
    table: { head: ['Round', 'Microblog', 'Forum'], rows: d.activity.map((r) => [Number(r.label), r.parts.twitter, r.parts.reddit]) } });
  if (d.mix.length) specs.push({ title: 'What people did', sub: 'All actions by type', svg: (th, w) => svgBars(th, w, { rows: d.mix.map((m) => ({ label: m.label, parts: { n: m.n } })), keys: [{ key: 'n', label: 'Actions', color: th.one }], label: 'Actions by type' }),
    table: { head: ['Action', 'Count'], rows: d.mix.map((m) => [m.label, m.n]) } });
  return specs;
}

function reportMarkdownFull(sim) {
  const { report, meta } = sim;
  const o = report.outline;
  const d = reportData(sim);
  const svgUri = (svg) => `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
  const mdCell = (c) => String(cell(c)).replace(/\|/g, '\\|').replace(/\n/g, ' ');
  const mdTable = (t) => `| ${t.head.map(mdCell).join(' | ')} |\n| ${t.head.map((_, i) => (i && t.rows.every((r) => typeof r[i] !== 'string') ? '---:' : '---')).join(' | ')} |\n${t.rows.map((r) => `| ${r.map(mdCell).join(' | ')} |`).join('\n')}`;
  const quote = (s) => String(s || '').trim().split('\n').map((l) => `> ${l}`).join('\n');
  const out = [`# ${o.title}`, quote(o.summary), `_${meta.name} · Swarm Studio simulation · ${new Date().toLocaleDateString()}_`];
  out.push('## At a glance', mdTable({ head: ['Measure', 'Value', 'Note'], rows: d.kpis.map((k) => [k.label, k.value, k.note || '']) }));
  if (o.takeaways?.length) out.push('## Key takeaways', o.takeaways.map((t) => `- ${t}`).join('\n'));
  for (const s of chartSpecs(d)) out.push(`## ${s.title}`, `_${s.sub}_`, `![${s.title}](${svgUri(s.svg(VIZ.light, 700))})`, mdTable(s.table));
  const posts = (list) => list.map((p) => `${quote(`${p.title ? `**${p.title}** ` : ''}${p.content}`)}\n>\n> — ${p.name} (@${p.handle}, ${p.stance}) · ${p.stat}`).join('\n\n');
  if (d.topTw.length) out.push('## Most engaging microblog posts', posts(d.topTw));
  if (d.topRd.length) out.push('## Top forum threads', posts(d.topRd));
  out.push('## Analyst write-up', o.sections.map((s, i) => `### ${s.title}\n\n${report.sections[i] || '_Not written._'}`).join('\n\n'));
  if (d.feedback) {
    out.push('## What every agent said', `_Exit poll: ${d.poll.question}_`, d.feedback.map((x) => `**${x.name}** (@${x.handle}, ${x.role}) · voted "${x.voteLabel}" · ${x.from === x.to ? x.to : `${x.from} → ${x.to}`} · mood ${signed(x.m0)} → ${signed(x.m1)}${x.themes.length ? ` · ${x.themes.join(', ')}` : ''}\n${quote(x.text)}`).join('\n\n'));
  }
  return `${out.join('\n\n')}\n`;
}

const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js'];

function mdBlocks(src) {
  const plain = (s) => s.replace(/\*\*|__|`/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/^#+\s*/, '').replace(/\s*\n\s*/g, ' ').trim();
  return String(src || '').split(/\n{2,}/).map((b) => b.trim()).filter(Boolean).flatMap((b) => {
    if (b.startsWith('>')) return [{ kind: 'quote', text: plain(b.replace(/^>\s?/gm, '')) }];
    if (/^\s*([-*]|\d+\.)\s/.test(b)) return b.split('\n').filter((l) => l.trim()).map((l) => ({ kind: 'li', text: plain(l.replace(/^\s*([-*]|\d+\.)\s+/, '')) }));
    return [{ kind: 'p', text: plain(b) }];
  });
}

async function reportPdf(sim) {
  for (const src of PDF_LIBS) await loadScript(src);
  const { jsPDF } = window.jspdf;
  const svgToPdf = window.svg2pdf?.svg2pdf;
  const { report, meta, agents } = sim;
  const o = report.outline;
  const d = reportData(sim);
  const th = VIZ.pdf;
  const T = pdfSafe;
  const doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const M = 46;
  const CW = PW - 2 * M;
  const INK = rgbOf(th.ink);
  const INK2 = rgbOf(th.ink2);
  const INK3 = rgbOf(th.ink3);
  const TEAL = rgbOf(th.one);
  let y = M;
  const room = (h) => { if (y + h > PH - M) { doc.addPage(); y = M; } };
  const font = (size, style = 'normal', color = INK) => { doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color); };
  const para = (s, { size = 10, style = 'normal', color = INK, x = M, w = CW, lh = 1.42, after = 6, bar = null, bullet = false } = {}) => {
    font(size, style, color);
    doc.splitTextToSize(T(s), w).forEach((ln, i) => {
      room(size * lh);
      if (bar) { doc.setFillColor(...bar); doc.rect(x - 10, y - 1, 2, size * lh, 'F'); }
      if (bullet && i === 0) { doc.setFillColor(...TEAL); doc.circle(x - 8, y + size * 0.5, 2, 'F'); }
      doc.text(ln, x, y, { baseline: 'top' });
      y += size * lh;
    });
    y += after;
  };
  const svgHeight = (svg, w) => { const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/); return (w * Number(vb[2])) / Number(vb[1]); };
  const drawSvg = async (svg, x, yy, w) => {
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-20000px;top:0;width:800px;';
    host.innerHTML = svg;
    document.body.appendChild(host);
    try {
      const opts = { x, y: yy, width: w, height: svgHeight(svg, w) };
      await (svgToPdf ? svgToPdf(host.firstElementChild, doc, opts) : doc.svg(host.firstElementChild, opts));
    } finally { host.remove(); }
  };
  const heading = (s) => { room(70); y += 10; para(s, { size: 15, style: 'bold', after: 8 }); };

  // Cover band: deep aurora gradient with the title on it.
  font(22, 'bold');
  const titleLines = doc.splitTextToSize(T(o.title), CW).slice(0, 3);
  const bandH = 74 + titleLines.length * 27 + 22;
  await drawSvg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${bandH}" width="${PW}" height="${bandH}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2e2a"/><stop offset="0.55" stop-color="#0d1628"/><stop offset="1" stop-color="#2b2152"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ee8b5"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><clipPath id="c"><rect width="${PW}" height="${bandH}"/></clipPath><rect width="${PW}" height="${bandH}" fill="url(#g)"/><g clip-path="url(#c)"><circle cx="70" cy="0" r="170" fill="#3ee8b5" fill-opacity="0.13"/><circle cx="${PW - 40}" cy="${bandH}" r="150" fill="#a78bfa" fill-opacity="0.16"/></g><rect y="${bandH - 4}" width="${PW}" height="4" fill="url(#a)"/></svg>`, 0, 0, PW);
  font(8.5, 'bold', [167, 243, 208]);
  doc.text('SWARM STUDIO  ·  PREDICTION REPORT', M, 40, { baseline: 'top' });
  font(22, 'bold', [255, 255, 255]);
  titleLines.forEach((ln, i) => doc.text(ln, M, 60 + i * 27, { baseline: 'top' }));
  font(9, 'normal', [200, 225, 218]);
  doc.text(T(`${clip(meta.name, 70)}  ·  ${agents.length} agents  ·  ${meta.sim?.round ?? 0} rounds  ·  ${new Date().toLocaleDateString()}`), M, 60 + titleLines.length * 27 + 6, { baseline: 'top' });
  y = bandH + 22;
  if (o.summary) para(o.summary, { size: 11.5, color: INK2, after: 14 });

  // KPI tiles, three per row.
  const tw = (CW - 20) / 3;
  for (const row of groups(d.kpis, 3)) {
    room(60);
    row.forEach((k, i) => {
      const x = M + i * (tw + 10);
      doc.setFillColor(243, 248, 246); doc.setDrawColor(222, 231, 228);
      doc.roundedRect(x, y, tw, 54, 6, 6, 'FD');
      font(7.5, 'bold', INK3); doc.text(T(k.label.toUpperCase()), x + 10, y + 9, { baseline: 'top' });
      font(16, 'bold', INK); doc.text(T(k.value), x + 10, y + 21, { baseline: 'top' });
      font(7.5, 'normal', INK3); doc.text(doc.splitTextToSize(T(k.note || ''), tw - 20)[0] || '', x + 10, y + 41, { baseline: 'top' });
    });
    y += 64;
  }
  if (o.takeaways?.length) { heading('Key takeaways'); for (const t of o.takeaways) para(t, { x: M + 14, w: CW - 14, bullet: true, after: 5 }); }

  heading('The numbers');
  for (const s of chartSpecs(d)) {
    const svg = s.svg(th, 700);
    room(svgHeight(svg, CW) + 46);
    para(s.title, { size: 12.5, style: 'bold', after: 1 });
    para(s.sub, { size: 8.5, color: INK2, after: 6 });
    await drawSvg(svg, M, y, CW);
    y += svgHeight(svg, CW) + 18;
  }

  const postList = (title, list) => {
    if (!list.length) return;
    heading(title);
    for (const p of list) {
      para(`${p.title ? `${p.title}: ` : ''}${clip(p.content, 500)}`, { size: 9.5, style: 'italic', x: M + 12, w: CW - 12, bar: TEAL, after: 2 });
      para(`${p.name} (@${p.handle}, ${p.stance})  ·  ${p.stat}`, { size: 8, color: INK3, x: M + 12, w: CW - 12, after: 10 });
    }
  };
  postList('Most engaging microblog posts', d.topTw);
  postList('Top forum threads', d.topRd);

  heading('Analyst write-up');
  o.sections.forEach((s, i) => {
    room(60);
    para(s.title, { size: 12, style: 'bold', after: 4 });
    for (const b of mdBlocks(report.sections[i] || 'Not written.')) {
      if (b.kind === 'quote') para(b.text, { size: 9.5, style: 'italic', color: INK2, x: M + 12, w: CW - 12, bar: TEAL, after: 7 });
      else if (b.kind === 'li') para(b.text, { size: 10, x: M + 14, w: CW - 14, bullet: true, after: 3 });
      else para(b.text, { size: 10, after: 7 });
    }
    y += 6;
  });

  if (d.feedback) {
    heading('What every agent said');
    para(`Exit poll: ${d.poll.question}  ·  most influential agents first`, { size: 9, color: INK2, after: 10 });
    for (const x of d.feedback) {
      font(8);
      const metaLines = doc.splitTextToSize(T(`@${x.handle}  ·  ${x.role}  ·  voted "${x.voteLabel}"  ·  ${x.from === x.to ? x.to : `${x.from} -> ${x.to}`}  ·  mood ${signed(x.m0)} -> ${signed(x.m1)}${x.themes.length ? `  ·  ${x.themes.join(', ')}` : ''}`), CW - 12);
      font(9.5);
      const body = doc.splitTextToSize(T(x.text), CW - 12);
      const h = 14 + metaLines.length * 10.5 + body.length * 13.4 + 4;
      room(h + 10);
      doc.setFillColor(...rgbOf(th.stance[x.to] || th.ink3));
      doc.rect(M, y, 2.5, h, 'F');
      font(10.5, 'bold'); doc.text(T(x.name), M + 12, y, { baseline: 'top' });
      let yy = y + 14;
      font(8, 'normal', INK3); for (const l of metaLines) { doc.text(l, M + 12, yy, { baseline: 'top' }); yy += 10.5; }
      font(9.5, 'normal', INK); for (const l of body) { doc.text(l, M + 12, yy, { baseline: 'top' }); yy += 13.4; }
      y += h + 12;
    }
  }

  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    font(7.5, 'normal', INK3);
    doc.text(T(`${clip(o.title, 90)}  ·  ${i} / ${pages}`), M, PH - 28, { baseline: 'top' });
  }
  return doc.output('blob');
}

const Sims = new Map();
let booted = Promise.resolve(); // capabilities resolving; storage reads wait for it

function makeCtx(sim) {
  const ctx = {
    sim, usage: sim.meta.usage, ctl: new AbortController(),
    emit: (type, data) => onEngine(sim.meta.id, type, data),
    set(fields, persist = false) {
      Object.assign(sim.meta, fields);
      ctx.emit('meta');
      if (persist) Store.put(sim.meta.id, sim.meta).catch(() => {});
    },
    log(msg, level = 'info') {
      const row = { ts: Date.now(), level, msg };
      sim.log.push(row);
      if (sim.log.length > 300) sim.log.shift();
      ctx.emit('log', row);
    },
  };
  return ctx;
}

const Engine = {
  ctx: null,
  busyWith(id) { return this.ctx?.sim.meta.id === id; },
  start(sim, task) {
    if (this.ctx) { toast(`"${clip(this.ctx.sim.meta.name, 40)}" is still running in this tab. Stop it or let it finish first.`); return false; }
    if (!AI.available) { toast('Claude is not available here. Open this page inside Claude to run simulations.'); return false; }
    const ctx = makeCtx(sim);
    this.ctx = ctx;
    task(ctx).catch((e) => fail(ctx, e)).finally(() => {
      if (this.ctx === ctx) this.ctx = null;
      ctx.emit('meta');
    });
    return true;
  },
  stop() { this.ctx?.ctl.abort(); },
};

const RESUME_COPY = {
  rate_limited: 'Claude asked us to slow down. Resume in a few minutes.',
  not_granted: 'Claude access for this page was declined. Allow it from the page’s permissions, then resume.',
  sampling_disabled: 'Claude is not available for this account here.',
  session_expired: 'Your Claude session expired. Sign in again, then resume.',
  cancelled: 'Stopped.',
};

function fail(ctx, e) {
  const m = ctx.sim.meta;
  const resume = { preparing: 'prepare', running: 'simulate', reporting: 'report' }[m.status] || m.resume || 'prepare';
  if (resume === 'report' && e.code === 'cancelled') {
    ctx.set({ status: 'simulated', stage: 'simulated', message: 'Report stopped', error: null }, true);
    return;
  }
  const message = RESUME_COPY[e.code] || `${e.message || e.code}. Resume to try again.`;
  ctx.log(message, e.code === 'cancelled' ? 'info' : 'error');
  ctx.set({ status: 'paused', resume, message, error: e.code === 'cancelled' ? null : (e.code || 'error') }, true);
}

function resumeSim(sim) {
  const r = sim.meta.resume || 'prepare';
  if (r === 'prepare') return Engine.start(sim, prepare);
  if (r === 'simulate') return Engine.start(sim, (ctx) => simulate(ctx, { rounds: sim.meta.sim?.rounds || sim.meta.settings.rounds, resume: true }));
  return Engine.start(sim, (ctx) => generateReport(ctx, { resume: true }));
}

async function loadSim(id) {
  if (Sims.has(id)) return Sims.get(id);
  const meta = await Store.get(id);
  if (!meta) return null;
  const parts = await Promise.all(['ontology', 'graph', 'config', 'follows', 'report'].map((n) => Store.get(part(id, n))));
  const agentParts = await Promise.all(Array.from({ length: meta.agentChunks || 0 }, (_, i) => Store.get(part(id, `agents-${i}`))));
  const sourceParts = await Promise.all(Array.from({ length: meta.sourceChunks || 0 }, (_, i) => Store.get(part(id, `source-${i}`))));
  const rounds = (await Store.list(`${id}/rounds`)).sort((a, b) => a.round - b.round);
  const [ontology, graph, config, follows, report] = parts;
  if (report?.poll?.chunks) {
    const lists = await Promise.all(Array.from({ length: report.poll.chunks }, (_, i) => Store.get(part(id, `poll-${i}`))));
    report.poll.results = lists.every(Boolean) ? lists.flatMap((l) => l.list) : [];
  }
  const sim = {
    meta, ontology, graph, config, follows: follows?.follows || null,
    agents: meta.agentChunks && agentParts.every(Boolean) ? agentParts.flatMap((p) => p.list) : null,
    source: sourceParts.filter(Boolean).map((p) => p.text).join(''),
    actions: rounds.flatMap((r) => r.actions || []),
    report: report ? { ...emptyReport(), ...report } : emptyReport(),
    log: [],
  };
  // A run that was in progress when its tab closed becomes resumable.
  const interrupted = { preparing: 'prepare', created: 'prepare', running: 'simulate', reporting: 'report' }[meta.status];
  if (interrupted) Object.assign(meta, { status: 'paused', resume: interrupted, message: 'Interrupted when the page closed. Resume to continue.' });
  Sims.set(id, sim);
  return sim;
}

async function createSim(d) {
  const id = `s-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const texts = d.files.map((f) => `=== ${f.name} ===\n${f.text}`);
  if (d.text.trim()) texts.push(`=== pasted text ===\n${d.text.trim()}`);
  const source = tidy(texts.join('\n\n')).slice(0, 300000);
  const chunks = [];
  for (let i = 0; i < source.length; i += 60000) chunks.push(source.slice(i, i + 60000));
  const meta = {
    id, name: d.requirement.trim().slice(0, 70), requirement: d.requirement.trim(), created_at: new Date().toISOString(),
    status: 'created', stage: 'created', progress: 0, message: 'Starting', error: null, resume: null,
    settings: { agents: d.agents, rounds: d.rounds, auto: d.auto }, counts: {}, usage: { calls: 0 },
    docs: [...d.files.map((f) => f.name), ...(d.text.trim() ? ['pasted text'] : [])], sourceChunks: chunks.length, agentChunks: 0,
  };
  for (const [i, c] of chunks.entries()) await Store.put(part(id, `source-${i}`), { text: c });
  await Store.put(id, meta);
  const sim = { meta, source, ontology: null, graph: null, config: null, follows: null, agents: null, actions: [], report: emptyReport(), log: [] };
  Sims.set(id, sim);
  return sim;
}

async function deleteSim(id) {
  await Store.delColl(`${id}/rounds`);
  await Store.delColl(`${id}/parts`);
  await Store.del(id);
  Sims.delete(id);
}

const fullRun = async (ctx) => {
  await prepare(ctx);
  if (!ctx.sim.meta.settings.auto) return;
  await simulate(ctx, { rounds: ctx.sim.meta.settings.rounds });
  if (ctx.sim.meta.status === 'simulated' && !ctx.ctl.signal.aborted) await generateReport(ctx);
};

function phase(m) {
  const s = m.status;
  if (s === 'paused') return { prepare: 'prep', simulate: 'sim', report: 'simdone' }[m.resume] || 'prep';
  return { created: 'prep', preparing: 'prep', ready: 'ready', running: 'sim', simulated: 'simdone', reporting: 'report', reported: 'done' }[s] || 'prep';
}
const isEarly = (m) => STAGE_ORDER.indexOf(m.stage) <= STAGE_ORDER.indexOf('graph') && m.stage !== 'ready' && phase(m) === 'prep';
const simulatedYet = (m) => ['simdone', 'report', 'done'].includes(phase(m));

function steps(m) {
  const ph = phase(m);
  const early = isEarly(m);
  const live = m.status !== 'paused';
  const reached = simulatedYet(m) ? 4 : ph === 'sim' ? 2 : ph === 'ready' || !early ? 1 : 0;
  return STEPS.map(([key, label], i) => ({
    key, label, locked: i > reached,
    done: [!early, reached >= 2 || ph === 'ready', simulatedYet(m), ph === 'done', false][i],
    live: [live && ph === 'prep' && early, live && ph === 'prep' && !early, live && ph === 'sim', live && ph === 'report', false][i],
  }));
}

function autoTab(m) {
  const ph = phase(m);
  if (ph === 'sim' || ph === 'simdone') return 'simulation';
  if (ph === 'report' || ph === 'done') return 'report';
  return isEarly(m) ? 'graph' : 'setup';
}

};

function estimate(agents, rounds) {
  const perRound = 2 * Math.ceil(Math.min(MAX_ACTIVE, agents * 0.22) / BATCH);
  const prep = 6 + Math.ceil(agents / 11);
  const poll = 1 + Math.ceil(agents / BATCH);
  const total = prep + rounds * perRound + 8 + poll;
  const minutes = Math.round((rounds * Math.ceil(perRound / AI.MAX) * 12 + (prep / AI.MAX) * 50 + (poll / AI.MAX) * 15 + 360) / 60);
  return { total, minutes };
}

const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function pdfText(file) {
  // Loading the worker as a plain script lets pdf.js parse on the main thread (no cross-origin Worker needed).
  await loadScript(PDF_WORKER);
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
  const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const c = await (await doc.getPage(i)).getTextContent();
    pages.push(c.items.map((it) => it.str).join(' '));
  }
  return pages.join('\n\n');
}

}
