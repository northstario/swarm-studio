<title>Swarm Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen console — graph canvas beside a step workbench, aurora night sky behind. Deliberately dark-only. */
:root {
  color-scheme: dark;
  --bg: #060912;
  --panel: rgba(214, 255, 240, 0.035);
  --panel-2: rgba(214, 255, 240, 0.065);
  --line: rgba(200, 255, 235, 0.09);
  --line-2: rgba(200, 255, 235, 0.17);
  --text: #e7f2ee;
  --muted: #9db3ae;
  --dim: #67807b;
  --aurora: #3ee8b5;
  --teal: #2dd4bf;
  --violet: #a78bfa;
  --magenta: #e879f9;
  --amber: #fbbf24;
  --red: #fb7185;
  --micro: #38bdf8;
  --forum: #fb923c;
  --ink: #03110c;
  --grad: linear-gradient(120deg, #3ee8b5, #2dd4bf 45%, #a78bfa);
  --radius: 14px;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --sans: 'Sora', system-ui, -apple-system, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1000px 560px at 6% -14%, rgba(62, 232, 181, 0.22), transparent 62%),
    radial-gradient(900px 520px at 96% -8%, rgba(167, 139, 250, 0.2), transparent 60%),
    radial-gradient(900px 640px at 55% 125%, rgba(232, 121, 249, 0.1), transparent 60%); }
#app { position: relative; z-index: 1; height: 100%; }
a { color: var(--teal); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--aurora); outline-offset: 2px; }
::selection { background: rgba(62, 232, 181, 0.35); }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
h1, h2, h3 { text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

.btn { border: 1px solid var(--line-2); background: var(--panel-2); padding: 9px 16px; border-radius: 10px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover:not(:disabled) { border-color: rgba(200, 255, 235, 0.34); background: rgba(214, 255, 240, 0.1); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--ink); font-weight: 600; box-shadow: 0 6px 24px -10px rgba(62, 232, 181, 0.8); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--grad); }
.btn.danger { border-color: rgba(251, 113, 133, 0.5); color: var(--red); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line-2); background: var(--panel-2); white-space: nowrap; color: var(--text); }
.chip.click { cursor: pointer; }
.chip.on { border-color: var(--aurora); background: rgba(62, 232, 181, 0.16); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.label { font: 600 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.bar { height: 6px; border-radius: 6px; background: rgba(214, 255, 240, 0.08); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--grad); border-radius: 6px; transition: width .4s; }
input[type=text], textarea, select { width: 100%; box-sizing: border-box; background: rgba(0, 0, 0, 0.28); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font: inherit; outline: none; }
textarea { resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--aurora); box-shadow: 0 0 0 3px rgba(62, 232, 181, 0.18); }
input[type=range] { width: 100%; accent-color: var(--aurora); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(214, 255, 240, 0.2); border-top-color: var(--aurora); animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.st-supportive { --c: #a3e635; } .st-opposing { --c: #fb7185; } .st-neutral { --c: #94a3b8; } .st-observer { --c: #c4b5fd; }
.st-chip { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink); background: linear-gradient(135deg, var(--c, #94a3b8), color-mix(in srgb, var(--c, #94a3b8) 40%, #ffffff)); }

/* home */
.nav { display: flex; align-items: center; gap: 12px; padding-block: 16px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; text-decoration: none; color: var(--text); }
.orb { width: 26px; height: 26px; border-radius: 50%; flex: none; background: conic-gradient(from 200deg, #3ee8b5, #2dd4bf, #a78bfa, #e879f9, #3ee8b5); box-shadow: 0 0 22px rgba(62, 232, 181, 0.55); }
.grow { flex: 1; }
.home { height: 100%; overflow: auto; }
.home-in { max-width: 1180px; margin: 0 auto; padding-block: 4px 80px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.hero { padding: 26px 0 26px; }
.hero h1 { font-size: clamp(34px, 5vw, 58px); line-height: 1.04; letter-spacing: -.03em; margin: 0 0 14px; }
.hero h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { max-width: 640px; color: var(--muted); font-size: 16px; margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.new-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
.drop { display: block; border: 1.5px dashed var(--line-2); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
.drop.over, .drop:hover { border-color: var(--aurora); background: rgba(62, 232, 181, 0.06); }
.files { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.file { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; background: var(--panel-2); font-size: 13px; min-width: 0; }
.file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file .x { margin-left: auto; cursor: pointer; color: var(--dim); background: none; border: 0; }
.field { display: flex; flex-direction: column; gap: 7px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.slider-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.slider-head { display: flex; justify-content: space-between; align-items: baseline; }
.slider-head b { font: 600 15px var(--mono); }
.note { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: rgba(45, 212, 191, 0.06); border: 1px solid rgba(45, 212, 191, 0.2); }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 13.5px; }
.check input { accent-color: var(--aurora); width: 16px; height: 16px; }
.history { margin-top: 44px; }
.history h2 { font-size: 20px; letter-spacing: -.01em; margin: 0 0 14px; }
.hist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.hist { cursor: pointer; transition: border-color .15s; position: relative; display: flex; flex-direction: column; gap: 8px; }
.hist:hover { border-color: rgba(62, 232, 181, 0.55); }
.hist h3 { font-size: 15px; margin: 0; line-height: 1.35; }
.hist .del { position: absolute; top: 12px; right: 12px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.08); font-size: 13.5px; }

/* workspace */
.ws { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.ws-head { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-bottom: 1px solid var(--line); background: rgba(6, 9, 18, 0.7); flex-wrap: wrap; }
.ws-title { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stepper { display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); overflow-x: auto; max-width: 100%; }
.step { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--muted); border: 1px solid transparent; background: none; white-space: nowrap; }
.step .n { font: 600 11px var(--mono); width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: rgba(214, 255, 240, 0.08); }
.step.done .n { background: rgba(62, 232, 181, 0.22); color: var(--aurora); }
.step.live .n { background: rgba(45, 212, 191, 0.25); color: var(--teal); }
.step.active { color: var(--text); background: var(--panel-2); border-color: var(--line-2); }
.step:disabled { opacity: .4; cursor: not-allowed; }
.status { display: flex; align-items: center; gap: 10px; min-width: 200px; flex: 1; }
.status .txt { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.status .bar { width: 100px; flex: none; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
.seg button { background: none; border: 0; padding: 6px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); }
.calls { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ws-body { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.ws-body.l-graph { grid-template-columns: 1fr 0fr; }
.ws-body.l-work { grid-template-columns: 0fr 1fr; }
.ws-body > * { min-width: 0; min-height: 0; overflow: hidden; }
.graph-panel { position: relative; border-right: 1px solid var(--line); }
.graph-panel svg { width: 100%; height: 100%; display: block; cursor: grab; }
.graph-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 30px; pointer-events: none; }
.legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 80%; }
.legend .chip, .graph-tools .chip { background: rgba(6, 9, 18, 0.8); font-size: 11px; }
.graph-tools { position: absolute; top: 12px; left: 14px; }
.node-card { position: absolute; top: 12px; right: 12px; width: min(340px, 85%); max-height: calc(100% - 24px); overflow: auto; background: rgba(9, 13, 24, 0.97); box-sizing: border-box; }
.node-card h4 { margin: 6px 0 8px; font-size: 16px; }
.node-card .close { float: right; cursor: pointer; color: var(--dim); background: none; border: 0; }
.rel { font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); color: var(--muted); }
.rel b { color: var(--text); font-weight: 500; }
.work { container-type: inline-size; overflow: auto !important; padding-block: 18px 30px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: var(--gutter-r); }
.work h2 { font-size: 18px; letter-spacing: -.01em; margin: 0 0 4px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stage { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.stage .num { font: 600 12px var(--mono); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(214, 255, 240, 0.06); color: var(--dim); }
.stage.done .num { background: rgba(62, 232, 181, 0.16); color: var(--aurora); }
.stage.live .num { background: rgba(45, 212, 191, 0.16); color: var(--teal); }
.stage .card { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.stage-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stage-head b { font-size: 14.5px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.stat { padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
.stat b { display: block; font: 600 21px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--dim); }
.tip { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.25); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.personas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.persona { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; text-align: left; min-width: 0; }
.persona:hover { border-color: var(--c, var(--line-2)); }
.persona .top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.persona .who { min-width: 0; }
.persona .who b, .persona .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.persona .who span { font: 12px var(--mono); color: var(--dim); }
.persona .bio { margin: 0; font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
.hours i { height: 14px; border-radius: 3px; background: rgba(214, 255, 240, 0.07); }
.hours i.on { background: var(--teal); }
.hours i.peak { background: var(--magenta); }
.hours i.off { background: rgba(214, 255, 240, 0.03); }
.timeline { display: flex; flex-direction: column; gap: 10px; border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; }
.timeline .ev { position: relative; }
.timeline .ev::before { content: ''; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--aurora)); box-shadow: 0 0 0 3px var(--bg); }
.run-box { background: linear-gradient(135deg, rgba(62, 232, 181, 0.1), rgba(167, 139, 250, 0.08)); border-color: rgba(62, 232, 181, 0.32); display: flex; flex-direction: column; gap: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
.tile .label { display: flex; align-items: center; gap: 7px; }
.tile b { display: block; font: 600 20px/1.3 var(--mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--dim); font: 11.5px var(--mono); }
.chart { width: 100%; height: 70px; display: block; }
.feeds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@container (max-width: 620px) { .feeds { grid-template-columns: 1fr; } }
.feed-col { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.feed-col > .label { display: flex; gap: 8px; align-items: center; }
.feed { display: flex; flex-direction: column; gap: 8px; }
.post { padding: 11px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); animation: rise .35s ease-out; min-width: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(-6px); } }
.post .top { display: flex; gap: 9px; align-items: center; min-width: 0; }
.post .top .avatar { width: 28px; height: 28px; font-size: 11px; cursor: pointer; }
.post .meta { min-width: 0; flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post .meta span { font-family: var(--mono); color: var(--dim); font-size: 11.5px; }
.badge { font: 600 10px var(--mono); letter-spacing: .05em; padding: 3px 7px; border-radius: 6px; background: rgba(214, 255, 240, 0.07); color: var(--muted); flex: none; }
.badge.write { background: rgba(62, 232, 181, 0.18); color: #a7f3d0; }
.post .body { margin-top: 7px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.post .body b { display: block; margin-bottom: 3px; }
.post .ref { margin-top: 7px; padding: 7px 10px; border-left: 2px solid var(--line-2); font-size: 12.5px; color: var(--muted); word-break: break-word; }
.post .foot { margin-top: 6px; font: 11px var(--mono); color: var(--dim); }
.split2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@container (min-width: 860px) { .split2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.paper { background: rgba(214, 255, 240, 0.045); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; }
.paper h1 { font-size: 25px; letter-spacing: -.02em; line-height: 1.2; margin: 8px 0 10px; }
.paper .summary { color: var(--muted); font-size: 15px; border-left: 3px solid var(--aurora); padding-left: 14px; margin: 0 0 18px; }
.paper .sec { border-top: 1px solid var(--line); padding: 16px 0 6px; }
.paper .sec h3 { margin: 0 0 8px; font-size: 17px; display: flex; gap: 10px; align-items: center; }
.paper .sec h3 .n { font: 600 12px var(--mono); color: var(--aurora); }
.md { font-size: 14.5px; line-height: 1.7; overflow-wrap: anywhere; }
.md blockquote { margin: 12px 0; padding: 10px 14px; border-left: 3px solid var(--teal); background: rgba(45, 212, 191, 0.07); border-radius: 0 10px 10px 0; color: #d3f7ef; }
.md p { margin: 0 0 12px; }
.md ul, .md ol { padding-left: 20px; }
.md code { font-family: var(--mono); font-size: .9em; background: rgba(0, 0, 0, 0.3); padding: 1px 5px; border-radius: 5px; }
.flow { display: flex; flex-direction: column; gap: 8px; }
.flow .ev { padding: 9px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; min-width: 0; }
.flow .ev .h { display: flex; gap: 8px; align-items: center; min-width: 0; }
.flow .ev .t { margin-left: auto; font: 11px var(--mono); color: var(--dim); flex: none; }
.flow .ev pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 var(--mono); color: var(--muted); max-height: 180px; overflow: auto; }
.flow details summary { cursor: pointer; color: var(--dim); font-size: 11.5px; }
.tool { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 6px; background: rgba(45, 212, 191, 0.15); color: var(--teal); flex: none; }
.tool.interview { background: rgba(163, 230, 53, 0.15); color: #bef264; }
.tool.plan { background: rgba(167, 139, 250, 0.2); color: #ddd6fe; }
.chatbox { display: flex; flex-direction: column; gap: 10px; min-height: 220px; max-height: 56vh; overflow: auto; padding: 4px 2px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: 14px; min-width: 0; }
.msg.user { align-self: flex-end; background: var(--grad); color: var(--ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.bot .who { font: 600 11px var(--mono); color: var(--dim); margin-bottom: 4px; }
.composer { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { min-height: 46px; max-height: 160px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; max-height: 260px; overflow: auto; }
.pick { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); cursor: pointer; font-size: 12.5px; background: none; text-align: left; min-width: 0; }
.pick.on { border-color: var(--aurora); background: rgba(62, 232, 181, 0.13); }
.pick .avatar { width: 24px; height: 24px; font-size: 10px; }
.pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.console { border-top: 1px solid var(--line); background: rgba(2, 4, 9, 0.88); font: 11.5px/1.55 var(--mono); }
.console summary { padding-block: 7px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); cursor: pointer; color: var(--dim); list-style: none; display: flex; gap: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.console .lines { max-height: 150px; overflow: auto; padding-bottom: 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.console .warn { color: var(--amber); } .console .error { color: var(--red); }
.modal-bg { position: fixed; inset: 0; background: rgba(2, 4, 9, 0.75); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { width: min(640px, 100%); max-height: 86vh; overflow: auto; background: #0c1220; box-sizing: border-box; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
'use strict';
// =====================================================================
// helpers
// =====================================================================
const app = document.getElementById('app');
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const md = (s) => DOMPurify.sanitize(marked.parse(String(s || '')));
const initials = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const pad = (n, w = 2) => String(n).padStart(w, '0');
const clip = (s, n) => (String(s || '').length > n ? `${String(s).slice(0, n - 1)}…` : String(s || ''));
const groups = (arr, n) => Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const str = (v) => (v == null ? '' : String(v)).trim();
const num = (v, lo, hi, d) => { const x = Number(v); return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : d; };
const hoursOf = (v, d) => { const h = Array.isArray(v) ? [...new Set(v.map(Number).filter((x) => Number.isInteger(x) && x >= 0 && x < 24))] : []; return h.length ? h.sort((a, b) => a - b) : d; };
const norm = (s) => String(s || '').toLowerCase().replace(/^the\s+/, '').replace(/[^\p{L}\p{N}]+/gu, '');
const pascal = (s) => str(s).replace(/[^A-Za-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join('');
const snakeUpper = (s) => str(s).replace(/([a-z])([A-Z])/g, '$1_$2').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').toUpperCase();
const tidy = (t) => t.replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
const wordsOf = (s) => new Set(String(s).toLowerCase().match(/\p{L}{4,}/gu) || []);
const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const codeErr = (code, message) => Object.assign(new Error(message || code), { code });
const evenSample = (arr, n) => (arr.length <= n ? arr : Array.from({ length: n }, (_, k) => arr[Math.floor((k * arr.length) / n)]));
function excerpt(text, max) {
  if (text.length <= max) return text;
  const head = Math.floor(max * 0.7);
  return `${text.slice(0, head)}\n\n[... middle omitted ...]\n\n${text.slice(-(max - head - 40))}`;
}
function chunkText(text, size = 8000, overlap = 300) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(i + size, text.length);
    if (end < text.length) {
      const win = text.slice(i, end);
      const cut = Math.max(win.lastIndexOf('\n\n'), win.lastIndexOf('. '));
      if (cut > size * 0.5) end = i + cut + 1;
    }
    out.push(text.slice(i, end).trim());
    if (end >= text.length) break;
    i = end - overlap;
  }
  return out.filter(Boolean);
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5500);
}
const scripts = {};
const loadScript = (src) => (scripts[src] ||= new Promise((res, rej) => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = res;
  s.onerror = () => rej(new Error(`Could not load ${src}`));
  document.head.appendChild(s);
}));

// =====================================================================
// Claude (the viewer's own account, through the page's `sample` capability)
// =====================================================================
// Stub engine only for local testing (a saved copy or localhost); inside a Claude viewer window.claude always exists.
const MOCK = !window.claude && (location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname));
const AI = {
  fn: null, tools: false, running: 0, waiting: [], MAX: 3,
  async init() {
    if (!window.claude?.use) return;
    this.fn = await claude.use('sample');
    if (this.fn) this.tools = !!(await this.fn.limits().catch(() => null))?.tools;
  },
  get available() { return MOCK || !!this.fn; },
  async slot(fn) {
    while (this.running >= this.MAX) await new Promise((r) => this.waiting.push(r));
    this.running++;
    try { return await fn(); } finally { this.running--; this.waiting.shift()?.(); }
  },
  wrap(e) {
    if (e instanceof Error && e.code) return e;
    return Object.assign(new Error(e?.message || e?.code || String(e)), { code: e?.code || 'upstream_error', partial: e?.text });
  },
  async json(ctx, prompt, { tier = 'quick', mock }) {
    if (ctx.ctl.signal.aborted) throw codeErr('cancelled');
    ctx.usage.calls++;
    if (MOCK) { await sleep(250); return mock(); }
    if (!this.fn) throw codeErr('sampling_disabled', 'Claude is not available in this view.');
    try {
      return await this.slot(() => this.fn.json(prompt, { modelTier: tier, cache: false, signal: ctx.ctl.signal }));
    } catch (e) { throw this.wrap(e); }
  },
  // A tool-using call over in-page evidence files; resolves with the final text.
  async agent(ctx, prompt, { files, onTool = () => {}, onText, mock }) {
    if (ctx.ctl.signal.aborted) throw codeErr('cancelled');
    ctx.usage.calls++;
    if (MOCK) {
      const t = evidenceTools(files, onTool);
      t[1].execute({ pattern: 'post', context: 0 });
      await sleep(600);
      const text = mock();
      onText?.({ text });
      return text;
    }
    if (!this.fn) throw codeErr('sampling_disabled', 'Claude is not available in this view.');
    const opts = { modelTier: 'default', signal: ctx.ctl.signal, onText };
    let input = prompt;
    if (this.tools) opts.tools = evidenceTools(files, onTool);
    else { opts.cache = false; input = `${prompt}\n\n## Evidence files\n${inlineEvidence(files)}`; }
    try {
      return (await this.slot(() => this.fn(input, opts))).text;
    } catch (e) { throw this.wrap(e); }
  },
};

// =====================================================================
// storage: the artifact's db, in this viewer's private area
// =====================================================================
const Store = {
  db: null, base: null, mem: new Map(), chains: {},
  async init() {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (db && uid) { this.db = db; this.base = `data/users/${uid}`; }
  },
  get saved() { return !!this.db; },
  put(path, obj) {
    const body = JSON.parse(JSON.stringify(obj));
    if (!this.db) { this.mem.set(path, body); return Promise.resolve(); }
    const ref = this.db.doc(`${this.base}/${path}`);
    const p = (this.chains[path] || Promise.resolve()).catch(() => {}).then(() => ref.set(body));
    this.chains[path] = p;
    return p.catch((e) => {
      if (e?.code === 'quota_exceeded') toast('Storage is full. Delete an old simulation to keep saving.');
      throw e;
    });
  },
  async get(path) {
    if (!this.db) return this.mem.get(path) ?? null;
    const s = await this.db.doc(`${this.base}/${path}`).get();
    return s.exists ? JSON.parse(JSON.stringify(s.data())) : null;
  },
  async list(coll) {
    if (!this.db) {
      const depth = coll ? coll.split('/').length + 1 : 1;
      return [...this.mem.entries()].filter(([k]) => (!coll || k.startsWith(`${coll}/`)) && k.split('/').length === depth).map(([, v]) => v);
    }
    const snap = await this.db.collection(coll ? `${this.base}/${coll}` : this.base).get();
    return snap.docs.map((d) => JSON.parse(JSON.stringify(d.data())));
  },
  async del(path) {
    if (!this.db) { this.mem.delete(path); return; }
    await this.db.doc(`${this.base}/${path}`).delete();
  },
  async delColl(coll) {
    if (!this.db) { for (const k of [...this.mem.keys()]) if (k.startsWith(`${coll}/`)) this.mem.delete(k); return; }
    const snap = await this.db.collection(`${this.base}/${coll}`).get();
    for (const d of snap.docs) await this.db.doc(`${this.base}/${coll}/${d.id}`).delete();
  },
};
const part = (id, name) => `${id}/parts/${name}`;

// =====================================================================
// stage 1-2: documents -> ontology -> graph -> personas -> clock
// =====================================================================
const LANG_RULE = 'Write all prose in the language of the prediction question.';
const STANCES = ['supportive', 'opposing', 'neutral', 'observer'];
const STAGE_ORDER = ['created', 'ontology', 'graph', 'personas', 'config', 'ready'];
const FALLBACK_TYPES = [
  { name: 'Person', description: 'Any individual not covered by a more specific type', attributes: [{ name: 'role', description: 'What they do' }] },
  { name: 'Organization', description: 'Any organization not covered by a more specific type', attributes: [{ name: 'org_type', description: 'Kind of organization' }] },
];

const ONTOLOGY_PROMPT = `You design the ontology for a social-media opinion simulation. You get source documents and a prediction question. Define the kinds of real-world ACTORS that could post and interact on social media about this situation, and the relationships between them.

Rules:
- Exactly 10 entity types. The first 8 are specific to these documents; the last 2 are the fallbacks "Person" (any individual) and "Organization" (any organization).
- Entity types are actors that can speak: individuals, companies, organizations, government bodies, regulators, media outlets, platforms, specific communities or groups. Never abstract concepts, topics, emotions, opinions or stances.
- Type names in PascalCase. Each has a description (max 100 characters) saying how it differs from the fallbacks, and 1-3 snake_case attributes.
- 6-10 relationship types in UPPER_SNAKE_CASE, each with a description and allowed source/target type pairs.
- analysis_summary: 3-5 sentences on what the documents describe and what the question asks.
${LANG_RULE} Names stay in English case conventions.

Reply with only JSON:
{"entity_types":[{"name":"","description":"","attributes":[{"name":"","description":""}]}],"edge_types":[{"name":"","description":"","source_targets":[{"source":"","target":""}]}],"analysis_summary":""}`;

function normalizeOntology(o) {
  const seen = new Set(['Person', 'Organization']);
  const specific = [];
  for (const t of o.entity_types || []) {
    const name = pascal(t.name);
    if (!name || seen.has(name)) continue;
    seen.add(name);
    specific.push({ name, description: str(t.description).slice(0, 140), attributes: (t.attributes || []).slice(0, 3) });
  }
  const entity_types = [...specific.slice(0, 8), ...FALLBACK_TYPES];
  const typeNames = new Set(entity_types.map((t) => t.name));
  const edgeSeen = new Set();
  const edge_types = [];
  for (const e of o.edge_types || []) {
    const name = snakeUpper(e.name);
    if (!name || edgeSeen.has(name)) continue;
    edgeSeen.add(name);
    const source_targets = (e.source_targets || []).map((st) => ({ source: pascal(st.source), target: pascal(st.target) }))
      .filter((st) => typeNames.has(st.source) && typeNames.has(st.target)).slice(0, 10);
    edge_types.push({ name, description: str(e.description).slice(0, 140), source_targets });
  }
  return { entity_types, edge_types: edge_types.slice(0, 10), analysis_summary: str(o.analysis_summary) };
}

async function buildOntology(ctx, requirement, text) {
  const o = await AI.json(ctx, `${ONTOLOGY_PROMPT}\n\n## Prediction question\n${requirement}\n\n## Documents\n${excerpt(text, 50000)}`, {
    tier: 'default',
    mock: () => ({
      entity_types: ['Company', 'Regulator', 'MediaOutlet', 'Expert', 'Customer', 'Investor', 'Employee', 'Community'].map((name) => ({ name, description: `Demo ${name}`, attributes: [] })),
      edge_types: ['REPORTS_ON', 'REGULATES', 'WORKS_FOR', 'CRITICIZES', 'SUPPORTS', 'INVESTS_IN'].map((name) => ({ name, description: `Demo ${name}`, source_targets: [] })),
      analysis_summary: `Demo analysis of: ${requirement}`,
    }),
  });
  return normalizeOntology(o);
}

const EXTRACT_PROMPT = `You extract a knowledge graph for a social-media simulation from one chunk of a document.
- List every concrete actor in the text that matches one of the given entity types: named people, organizations, media, government bodies, communities. Use the most specific type; use Person or Organization when nothing else fits. Skip abstract concepts, events, places and topics.
- Use each actor's canonical full name, the same way every time.
- summary: 1-2 sentences on who they are and their role in this situation, from this text only.
- relations: factual links between listed actors, using the given relationship types, each with a one-sentence fact.
${LANG_RULE}

Reply with only JSON:
{"entities":[{"name":"","type":"","summary":"","attributes":{}}],"relations":[{"source":"","target":"","type":"","fact":""}]}`;

function mockExtract(chunk, ontology) {
  const names = [...new Set(chunk.match(/\b[A-Z][a-z]+(?: [A-Z][a-z]+)+\b/g) || [])].slice(0, 7);
  const types = ontology.entity_types.map((t) => t.name);
  return {
    entities: names.map((name, i) => ({ name, type: types[i % types.length], summary: `${name} appears in the source.`, attributes: {} })),
    relations: names.slice(1).map((name, i) => ({ source: names[i], target: name, type: ontology.edge_types[0]?.name || 'RELATED_TO', fact: `${names[i]} is linked to ${name}.` })),
  };
}

async function buildGraph(ctx, ontology, text) {
  const chunks = evenSample(chunkText(text), 12);
  const typeNames = new Set(ontology.entity_types.map((t) => t.name));
  const edgeNames = new Set(ontology.edge_types.map((t) => t.name));
  const schema = `## Entity types\n${ontology.entity_types.map((t) => `- ${t.name}: ${t.description}`).join('\n')}\n\n## Relationship types\n${ontology.edge_types.map((t) => `- ${t.name}: ${t.description}`).join('\n')}`;
  const graph = { nodes: [], edges: [] };
  const byKey = new Map();
  const edgeKeys = new Set();
  ctx.sim.graphPreview = graph;
  let done = 0;
  const merge = (r) => {
    for (const e of r.entities || []) {
      const key = norm(e.name);
      if (!key || graph.nodes.length >= 250 && !byKey.has(key)) continue;
      const type = typeNames.has(pascal(e.type)) ? pascal(e.type) : 'Person';
      let n = byKey.get(key);
      if (!n) {
        n = { id: `n${graph.nodes.length + 1}`, name: str(e.name).slice(0, 120), type, summary: str(e.summary).slice(0, 400), attributes: e.attributes && typeof e.attributes === 'object' ? e.attributes : {} };
        graph.nodes.push(n);
        byKey.set(key, n);
        continue;
      }
      if ((n.type === 'Person' || n.type === 'Organization') && type !== 'Person' && type !== 'Organization') n.type = type;
      const s = str(e.summary);
      if (s && !n.summary.includes(s.slice(0, 40))) n.summary = `${n.summary} ${s}`.trim().slice(0, 400);
      if (e.attributes && typeof e.attributes === 'object') Object.assign(n.attributes, e.attributes);
    }
    for (const rel of r.relations || []) {
      const s = byKey.get(norm(rel.source));
      const t = byKey.get(norm(rel.target));
      if (!s || !t || s === t) continue;
      const type = edgeNames.has(snakeUpper(rel.type)) ? snakeUpper(rel.type) : 'RELATED_TO';
      const k = `${s.id}|${t.id}|${type}`;
      if (edgeKeys.has(k)) continue;
      edgeKeys.add(k);
      graph.edges.push({ id: `e${graph.edges.length + 1}`, source: s.id, target: t.id, type, fact: str(rel.fact).slice(0, 300) });
    }
  };
  await Promise.all(chunks.map(async (chunk, i) => {
    const r = await AI.json(ctx, `${EXTRACT_PROMPT}\n\n${schema}\n\n## Text (chunk ${i + 1} of ${chunks.length})\n${chunk}`, { tier: 'default', mock: () => mockExtract(chunk, ontology) });
    merge(r);
    done++;
    ctx.set({ progress: 15 + Math.round((done / chunks.length) * 30), message: `Extracted ${done}/${chunks.length} chunks · ${graph.nodes.length} entities` });
    ctx.emit('graph');
  }));
  if (!graph.nodes.length) throw codeErr('empty', 'No actors found in the documents. Try richer seed material.');
  return graph;
}

const PERSONA_PROMPT = `You write realistic social-media personas for an opinion simulation. Each persona must feel like a real account, grounded in the facts you are given, with its own voice, interests and stance on the situation.

For every requested ref, return one persona:
- kind: "person", "institution", "media" or "group". Institutions, media and groups are official accounts: age and gender are null, and the persona describes the account's positioning, audience, tone and official line.
- username: a plausible lowercase handle without @.
- bio: max 160 characters, written as the account's own profile bio.
- persona: 500-800 characters covering background and link to this situation, personality, how they post (tone, length, habits), what they care about, what angers or moves them, and what they have already done or said in this situation.
- stance toward the central development in the question: "supportive", "opposing", "neutral" or "observer". sentiment: -1 (hostile) to 1 (enthusiastic).
- activity (0-1, how often they post), influence (0.5-3), active_hours (local hours 0-23 when they are online). Guide: institutions activity 0.1-0.3, hours 9-17, influence 2.5-3; media 0.4-0.6, hours 7-23, influence 2-2.5; public figures and experts 0.4-0.6, influence 1.5-2; ordinary people 0.5-0.9, mostly evenings, influence 0.6-1.2.
- Keep each ref exactly as given.
${LANG_RULE}

Reply with only JSON:
{"personas":[{"ref":"","kind":"","name":"","username":"","bio":"","persona":"","age":null,"gender":null,"mbti":"","country":"","profession":"","interests":[],"stance":"","sentiment":0,"activity":0.5,"influence":1,"active_hours":[]}]}`;

const SEGMENTS_PROMPT = `You plan the general public for a social-media simulation. Split the people who would plausibly see and react to this situation online into 4-8 distinct audience segments (by role, demographic, interest or attitude). Include critics, supporters, the indifferent and the curious. The share values sum to 1.
${LANG_RULE}
Reply with only JSON: {"segments":[{"label":"","description":"","share":0.2}]}`;

function mockPersona(ref, name) {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const n = name || `${pick(['Asha', 'Ben', 'Chen', 'Dara', 'Eli', 'Farah', 'Gus', 'Hana', 'Ivo', 'Juno'])} ${pick(['Rao', 'Lee', 'Smith', 'Okafor', 'Kim', 'Silva', 'Novak'])}`;
  return {
    ref, kind: 'person', name: n, username: n.toLowerCase().replace(/\W+/g, '_'), bio: `Demo bio for ${n}`,
    persona: `${n} is a demo persona for checking the page offline.`, age: 20 + Math.floor(Math.random() * 40), gender: pick(['male', 'female']),
    mbti: pick(['INTJ', 'ENFP', 'ISTJ', 'ESFP']), country: 'India', profession: pick(['engineer', 'teacher', 'analyst', 'student']),
    interests: ['tech', 'policy'], stance: pick(STANCES), sentiment: Math.random() * 2 - 1, activity: 0.4 + Math.random() * 0.5,
    influence: 0.6 + Math.random() * 2, active_hours: [8, 9, 12, 18, 19, 20, 21, 22],
  };
}

function normalizePersona(p, id, entity) {
  const name = str(p.name) || entity?.name || `User ${id}`;
  return {
    id, ref: entity?.id || null, source_type: entity?.type || 'Public',
    kind: ['person', 'institution', 'media', 'group'].includes(p.kind) ? p.kind : 'person',
    name: name.slice(0, 120),
    username: str(p.username || name).toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24) || `user${id}`,
    bio: str(p.bio).slice(0, 200),
    persona: (str(p.persona) || entity?.summary || '').slice(0, 1200),
    age: Number.isInteger(p.age) ? p.age : null,
    gender: p.gender ? str(p.gender).slice(0, 20) : null,
    mbti: str(p.mbti).slice(0, 8), country: str(p.country).slice(0, 40), profession: str(p.profession).slice(0, 60),
    interests: (Array.isArray(p.interests) ? p.interests : []).map(str).filter(Boolean).slice(0, 6),
    stance: STANCES.includes(p.stance) ? p.stance : 'neutral',
    sentiment: num(p.sentiment, -1, 1, 0), activity: num(p.activity, 0.05, 1, 0.5), influence: num(p.influence, 0.3, 3, 1),
    active_hours: hoursOf(p.active_hours, [8, 9, 10, 12, 13, 18, 19, 20, 21, 22]),
  };
}

async function buildAgents(ctx, { requirement, ontology, graph, target }) {
  const degree = new Map();
  for (const e of graph.edges) for (const k of [e.source, e.target]) degree.set(k, (degree.get(k) || 0) + 1);
  const nameOf = new Map(graph.nodes.map((n) => [n.id, n.name]));
  const entities = [...graph.nodes].sort((a, b) => (degree.get(b.id) || 0) - (degree.get(a.id) || 0)).slice(0, target);
  const crowdCount = Math.max(0, target - entities.length);
  const brief = `## Situation\n${ontology.analysis_summary}\n\n## Prediction question\n${requirement}`;
  const results = new Map();
  const total = entities.length + crowdCount;
  const partial = () => {
    ctx.sim.agentsPreview = [...results.values()].map((p, i) => normalizePersona(p, i, null));
    ctx.set({ progress: 50 + Math.round((results.size / total) * 35), message: `Wrote ${results.size}/${total} personas` });
    ctx.emit('agents');
  };
  const jobs = groups(entities, 8).map((batch) => async () => {
    const blocks = batch.map((n) => {
      const facts = graph.edges.filter((e) => e.source === n.id || e.target === n.id).slice(0, 8)
        .map((e) => `  - ${e.fact || `${nameOf.get(e.source)} ${e.type} ${nameOf.get(e.target)}`}`).join('\n');
      return `### ref: ${n.id}\nName: ${n.name}\nType: ${n.type}\nSummary: ${n.summary}\nAttributes: ${JSON.stringify(n.attributes)}\nFacts:\n${facts || '  - (none)'}`;
    }).join('\n\n');
    const r = await AI.json(ctx, `${PERSONA_PROMPT}\n\n${brief}\n\n## Write personas for these actors from the source material\n${blocks}`, {
      tier: 'default', mock: () => ({ personas: batch.map((n) => mockPersona(n.id, n.name)) }),
    });
    for (const p of r.personas || []) if (batch.some((n) => n.id === p.ref)) results.set(p.ref, p);
    partial();
  });
  if (crowdCount) {
    const seg = await AI.json(ctx, `${SEGMENTS_PROMPT}\n\n${brief}`, {
      tier: 'default',
      mock: () => ({ segments: [{ label: 'Everyday users', description: 'General public', share: 0.6 }, { label: 'Skeptics', description: 'Doubtful observers', share: 0.4 }] }),
    });
    const segments = (seg.segments || []).filter((s) => s.label);
    if (!segments.length) segments.push({ label: 'General public', description: 'Ordinary people following the story', share: 1 });
    const totalShare = segments.reduce((s, x) => s + (Number(x.share) || 0), 0) || segments.length;
    let next = 1;
    segments.forEach((s, i) => {
      const count = i === segments.length - 1 ? crowdCount - (next - 1) : Math.round(((Number(s.share) || 1) / totalShare) * crowdCount);
      const refs = Array.from({ length: Math.max(0, count) }, () => `crowd-${next++}`);
      for (const batch of groups(refs, 12)) {
        jobs.push(async () => {
          const r = await AI.json(ctx, `${PERSONA_PROMPT}\n\n${brief}\n\n## Create these members of the public\nSegment: ${s.label} — ${s.description}\nWrite ${batch.length} distinct individuals (kind "person") from this segment, varied in age, job, location, temperament and stance.\nRefs: ${batch.join(', ')}`, {
            tier: 'default', mock: () => ({ personas: batch.map((ref) => mockPersona(ref)) }),
          });
          for (const p of r.personas || []) if (batch.includes(p.ref)) results.set(p.ref, p);
          partial();
        });
      }
    });
  }
  let hardError = null;
  await Promise.all(jobs.map((j) => j().catch((e) => {
    if (['rate_limited', 'not_granted', 'sampling_disabled', 'cancelled', 'session_expired'].includes(e.code)) hardError ||= e;
    else ctx.log(`A persona batch failed (${e.code || e.message}); those agents get a plain persona.`, 'warn');
  })));
  if (hardError) throw hardError;
  const byId = new Set(entities.map((n) => n.id));
  const agents = [];
  for (const n of entities) agents.push(normalizePersona(results.get(n.id) || { name: n.name, persona: n.summary }, agents.length, n));
  for (const [ref, p] of results) if (!byId.has(ref)) agents.push(normalizePersona(p, agents.length, null));
  const used = new Set();
  for (const a of agents) {
    let u = a.username;
    for (let k = 2; used.has(u); k++) u = `${a.username}${k}`;
    used.add(u);
    a.username = u;
  }
  return agents;
}

const CONFIG_PROMPT = `You set up the clock and the opening moves of a social-media simulation about a real-world situation.
- Infer where the audience lives and their daily rhythm. start_hour is the local hour when the story breaks.
- total_hours (24-168): short for breaking news, longer for slow-burning topics. minutes_per_round (30-120).
- peak_hours: when this audience is most active. off_peak_hours: when almost nobody posts.
- hot_topics: 3-6 short topic tags people will discuss. narrative_direction: one or two sentences on how the conversation is likely to develop.
- initial_posts: 3-8 posts that open the conversation, each by a specific agent from the list (poster_id), on "twitter" or "reddit". Official sources and media usually post first. Reddit posts need a title. Write the content in the poster's voice.
${LANG_RULE}

Reply with only JSON:
{"timezone":"","start_hour":8,"total_hours":72,"minutes_per_round":60,"peak_hours":[],"off_peak_hours":[],"hot_topics":[],"narrative_direction":"","initial_posts":[{"poster_id":0,"platform":"twitter","title":"","content":""}],"reasoning":""}`;

async function buildConfig(ctx, { requirement, ontology, text, agents }) {
  const roster = agents.map((a) => `${a.id} | ${a.name} | ${a.kind} | ${a.profession || a.source_type} | ${a.stance}`).join('\n');
  const c = await AI.json(ctx, `${CONFIG_PROMPT}\n\n## Situation\n${ontology.analysis_summary}\n\n## Prediction question\n${requirement}\n\n## Source excerpt\n${excerpt(text, 8000)}\n\n## Agents (id | name | kind | role | stance)\n${roster}`, {
    tier: 'default',
    mock: () => ({
      timezone: 'UTC+5:30', start_hour: 9, total_hours: 48, minutes_per_round: 60, peak_hours: [9, 10, 20, 21, 22], off_peak_hours: [1, 2, 3, 4, 5],
      hot_topics: ['launch', 'pricing', 'trust'], narrative_direction: 'Demo: early buzz, then skepticism.',
      initial_posts: agents.slice(0, 3).map((a, i) => ({ poster_id: a.id, platform: i % 2 ? 'reddit' : 'twitter', title: 'Demo thread', content: `Demo opening post by ${a.name}.` })),
    }),
  });
  const top = [...agents].sort((a, b) => b.influence - a.influence)[0];
  return {
    timezone: str(c.timezone).slice(0, 40),
    start_hour: Math.round(num(c.start_hour, 0, 23, 8)),
    total_hours: Math.round(num(c.total_hours, 12, 168, 72)),
    minutes_per_round: Math.round(num(c.minutes_per_round, 15, 240, 60)),
    peak_hours: hoursOf(c.peak_hours, [9, 10, 11, 14, 15, 20, 21, 22]),
    off_peak_hours: hoursOf(c.off_peak_hours, [0, 1, 2, 3, 4, 5]),
    hot_topics: (Array.isArray(c.hot_topics) ? c.hot_topics : []).map(str).filter(Boolean).slice(0, 8),
    narrative_direction: str(c.narrative_direction).slice(0, 600),
    reasoning: str(c.reasoning).slice(0, 800),
    initial_posts: (Array.isArray(c.initial_posts) ? c.initial_posts : []).filter((p) => str(p.content)).slice(0, 8).map((p) => ({
      poster_id: agents[Number(p.poster_id)] ? Number(p.poster_id) : top.id,
      platform: p.platform === 'reddit' ? 'reddit' : 'twitter',
      title: str(p.title).slice(0, 200), content: str(p.content).slice(0, 2000),
    })),
  };
}

async function saveAgents(sim) {
  const chunks = groups(sim.agents, 40);
  for (const [i, c] of chunks.entries()) await Store.put(part(sim.meta.id, `agents-${i}`), { list: c });
  sim.meta.agentChunks = chunks.length;
}

async function prepare(ctx) {
  const sim = ctx.sim;
  const m = sim.meta;
  ctx.set({ status: 'preparing', error: null, resume: null }, true);
  if (!sim.ontology) {
    ctx.set({ stage: 'ontology', progress: 6, message: 'Designing the ontology' }, true);
    sim.ontology = await buildOntology(ctx, m.requirement, sim.source);
    await Store.put(part(m.id, 'ontology'), sim.ontology);
    ctx.emit('graph');
    ctx.log(`Ontology: ${sim.ontology.entity_types.length} actor types, ${sim.ontology.edge_types.length} relationship types`);
  }
  if (!sim.graph) {
    ctx.set({ stage: 'graph', progress: 15, message: 'Building the knowledge graph' }, true);
    sim.graph = await buildGraph(ctx, sim.ontology, sim.source);
    sim.graphPreview = null;
    await Store.put(part(m.id, 'graph'), sim.graph);
    m.counts.entities = sim.graph.nodes.length;
    m.counts.relations = sim.graph.edges.length;
    ctx.emit('graph');
    ctx.log(`Graph: ${sim.graph.nodes.length} entities, ${sim.graph.edges.length} relations`);
  }
  if (!sim.agents) {
    ctx.set({ stage: 'personas', progress: 50, message: 'Writing agent personas' }, true);
    sim.agents = await buildAgents(ctx, { requirement: m.requirement, ontology: sim.ontology, graph: sim.graph, target: m.settings.agents });
    sim.agentsPreview = null;
    await saveAgents(sim);
    m.counts.agents = sim.agents.length;
    ctx.emit('agents');
    ctx.log(`Personas: ${sim.agents.length} agents (${sim.agents.filter((a) => a.ref).length} from the graph)`);
  }
  if (!sim.config) {
    ctx.set({ stage: 'config', progress: 90, message: 'Setting the clock and opening posts' }, true);
    sim.config = await buildConfig(ctx, { requirement: m.requirement, ontology: sim.ontology, text: sim.source, agents: sim.agents });
    await Store.put(part(m.id, 'config'), sim.config);
    ctx.emit('agents');
  }
  ctx.set({ status: 'ready', stage: 'ready', progress: 100, message: `${sim.agents.length} agents ready to simulate` }, true);
}

// =====================================================================
// stage 3: the round loop (two platforms, Claude plays agents in batches)
// =====================================================================
const MAX_ACTIVE = 60;
const BATCH = 12;
const FEED_SIZE = 6;
const PLATFORMS = ['twitter', 'reddit'];
const ACTIONS = {
  twitter: { CREATE_POST: '{"content"} max 280 characters', LIKE_POST: '{"post_id"}', REPOST: '{"post_id"}', QUOTE_POST: '{"post_id","content"}', FOLLOW: '{"user"} handle', DO_NOTHING: '{}' },
  reddit: { CREATE_POST: '{"title","content"}', CREATE_COMMENT: '{"post_id","content"}', LIKE_POST: '{"post_id"} upvote', DISLIKE_POST: '{"post_id"} downvote', LIKE_COMMENT: '{"comment_id"} upvote', DISLIKE_COMMENT: '{"comment_id"} downvote', FOLLOW: '{"user"} handle', MUTE: '{"user"} handle', DO_NOTHING: '{}' },
};
const actPrompt = (platform) => `You are the engine of a social-media simulation on a ${platform === 'twitter' ? 'Twitter-like microblog' : 'Reddit-like forum'}. You play several independent users at once. Each user decides alone, from their own persona, stance, mood, memory and only the posts in their own feed. They do not know they are simulated and never mention it.

Each user takes exactly one action this turn:
${Object.entries(ACTIONS[platform]).map(([k, v]) => `- ${k} ${v}`).join('\n')}

Behave like real people: most scroll and react more than they write; they write when they have something to say; vary length, tone and register; agree, argue, joke, ask, correct; no hashtag spam; never repeat an earlier post. Only use post, comment and user ids that appear in that user's own feed.
${LANG_RULE}

For CREATE_POST, QUOTE_POST and CREATE_COMMENT also give sentiment: how the text feels about the central development, from -1 (very negative) to 1 (very positive).

Reply with only JSON, one entry per user, omitting unused fields:
{"actions":[{"agent":0,"action":"","post_id":"","comment_id":"","user":"","title":"","content":"","sentiment":0}]}`;

function clockAt(config, mpr, round) {
  const m = config.start_hour * 60 + round * mpr;
  return { day: Math.floor(m / 1440) + 1, hour: Math.floor(m / 60) % 24, minute: m % 60 };
}
const fmtClock = (c) => `Day ${c.day}, ${pad(c.hour)}:${pad(c.minute)}`;

function seedFollows(agents) {
  const follows = {};
  for (const a of agents) {
    const weights = agents.map((b) => (b.id === a.id ? 0 : b.influence ** 2 * (b.stance === a.stance ? 1.5 : 1)));
    const total = weights.reduce((s, w) => s + w, 0);
    const want = Math.min(agents.length - 1, 5 + Math.floor(Math.random() * 11));
    const set = new Set();
    for (let guard = 0; set.size < want && guard < 300; guard++) {
      let r = Math.random() * total;
      let i = 0;
      while (i < weights.length - 1 && r > weights[i]) r -= weights[i++];
      if (agents[i] && agents[i].id !== a.id) set.add(agents[i].id);
    }
    follows[a.id] = [...set];
  }
  return follows;
}

function pickActive(agents, config, hour) {
  const mult = config.peak_hours.includes(hour) ? 1.5 : config.off_peak_hours.includes(hour) ? 0.3 : 1;
  const target = Math.min(MAX_ACTIVE, Math.max(1, Math.round((0.1 + Math.random() * 0.2) * agents.length * mult)));
  const pool = agents.filter((a) => Math.random() < a.activity * (a.active_hours.includes(hour) ? 1 : 0.1));
  return shuffle(pool).slice(0, target);
}

class World {
  constructor(agents, topics, follows) {
    this.agents = agents;
    this.byHandle = new Map(agents.map((a) => [a.username, a]));
    this.interestWords = new Map(agents.map((a) => [a.id, wordsOf(`${a.interests.join(' ')} ${topics.join(' ')}`)]));
    this.state = { seq: { T: 0, R: 0, C: 0 }, twitter: [], reddit: [], follows: JSON.parse(JSON.stringify(follows)), mutes: {}, memory: {} };
    this.posts = new Map();
    this.comments = new Map();
  }
  remember(agentId, line) {
    const m = (this.state.memory[agentId] ||= []);
    m.push(line);
    if (m.length > 6) m.shift();
  }
  relevance(agent, text) {
    const w = wordsOf(text);
    let hit = 0;
    for (const x of this.interestWords.get(agent.id)) if (w.has(x)) hit++;
    return Math.min(1, hit / 3);
  }
  feed(platform, agent, round) {
    const muted = new Set(this.state.mutes[agent.id] || []);
    const pool = this.state[platform].filter((p) => p.author !== agent.id && !muted.has(p.author) && round - p.round <= 12);
    if (!pool.length) return [];
    if (platform === 'twitter') {
      const following = new Set(this.state.follows[agent.id] || []);
      const pop = (p) => p.likes + 2 * p.reposts + 2 * p.quotes;
      const maxPop = Math.log1p(Math.max(1, ...pool.map(pop)));
      const score = (p) => 0.4 * Math.exp(-(round - p.round) / 4) + 0.3 * (Math.log1p(pop(p)) / maxPop) + 0.3 * this.relevance(agent, p.content) + (following.has(p.author) ? 0.5 : 0) + Math.random() * 0.15;
      return pool.map((p) => [score(p), p]).sort((a, b) => b[0] - a[0]).slice(0, FEED_SIZE).map((x) => x[1]);
    }
    const hot = (p) => (p.score + p.comments.length + 1) / (round - p.round + 2) ** 1.5;
    const maxHot = Math.max(...pool.map(hot)) || 1;
    const score = (p) => 0.7 * (hot(p) / maxHot) + 0.3 * this.relevance(agent, `${p.title} ${p.content}`) + Math.random() * 0.1;
    return pool.map((p) => [score(p), p]).sort((a, b) => b[0] - a[0]).slice(0, FEED_SIZE).map((x) => x[1]);
  }
  render(platform, p) {
    const a = this.agents[p.author];
    if (platform === 'twitter') {
      const stats = `♥${p.likes} ↻${p.reposts} ❝${p.quotes}`;
      if (p.repost_of) { const o = this.posts.get(p.repost_of); return `[${p.id}] @${a.username} reposted @${this.agents[o.author].username}: "${clip(o.content, 200)}" (${stats})`; }
      if (p.quote_of) { const o = this.posts.get(p.quote_of); return `[${p.id}] @${a.username} (${a.name}) quoting @${this.agents[o.author].username} "${clip(o.content, 100)}": "${clip(p.content, 220)}" (${stats})`; }
      return `[${p.id}] @${a.username} (${a.name}): "${clip(p.content, 240)}" (${stats})`;
    }
    const topc = [...p.comments].sort((x, y) => y.score - x.score).slice(0, 2).map((c) => `\n    [${c.id}] @${this.agents[c.author].username}: "${clip(c.content, 120)}" (score ${c.score})`).join('');
    return `[${p.id}] "${clip(p.title, 100)}" by @${a.username} · score ${p.score} · ${p.comments.length} comments\n    ${clip(p.content, 200)}${topc}`;
  }
  newPost(platform, fields) {
    const key = platform === 'twitter' ? 'T' : 'R';
    const p = platform === 'twitter'
      ? { id: `${key}${++this.state.seq[key]}`, likes: 0, reposts: 0, quotes: 0, likers: [], ...fields }
      : { id: `${key}${++this.state.seq[key]}`, title: '', score: 0, votes: {}, comments: [], ...fields };
    this.state[platform].push(p);
    this.posts.set(p.id, p);
    return p;
  }
  // Apply one chosen action; returns its log record, or null if it was invalid.
  apply(platform, agent, a, round, clock) {
    if (!agent) return null;
    const rec = { round, day: clock.day, hour: clock.hour, platform, agent_id: agent.id, handle: agent.username, action: a.action };
    const content = String(a.content || '').trim();
    const target = this.byHandle.get(String(a.user || '').replace(/^@/, '').toLowerCase());
    let p = this.posts.get(String(a.post_id || '').trim());
    if (p && p.repost_of) p = this.posts.get(p.repost_of);
    if (p && !p.id.startsWith(platform === 'twitter' ? 'T' : 'R')) p = null;
    const ref = (post) => Object.assign(rec, { post_id: post.id, ref_author: this.agents[post.author].username, ref_content: clip(post.content || post.title, 200) });
    const vote = (obj, v) => { const prev = obj.votes[agent.id] || 0; if (prev === v) return false; obj.score += v - prev; obj.votes[agent.id] = v; return true; };
    const tone = () => { if (a.sentiment != null && a.sentiment !== '' && Number.isFinite(Number(a.sentiment))) rec.sentiment = Math.round(num(a.sentiment, -1, 1, 0) * 100) / 100; };
    switch (a.action) {
      case 'CREATE_POST': {
        if (!content && !a.title) return null;
        const post = this.newPost(platform, { author: agent.id, round, content: content.slice(0, platform === 'twitter' ? 400 : 3000), title: String(a.title || '').slice(0, 200) });
        Object.assign(rec, { post_id: post.id, title: post.title || undefined, content: post.content });
        tone();
        this.remember(agent.id, `R${round} ${platform}: posted ${post.title ? `"${clip(post.title, 60)}" ` : ''}"${clip(post.content, 120)}"`);
        return rec;
      }
      case 'LIKE_POST':
      case 'DISLIKE_POST': {
        if (!p) return null;
        if (platform === 'twitter') {
          if (a.action === 'DISLIKE_POST' || p.likers.includes(agent.id)) return null;
          p.likers.push(agent.id);
          p.likes++;
        } else if (!vote(p, a.action === 'LIKE_POST' ? 1 : -1)) return null;
        ref(p);
        this.remember(agent.id, `R${round} ${platform}: ${a.action === 'LIKE_POST' ? 'liked' : 'downvoted'} @${rec.ref_author}'s post "${clip(rec.ref_content, 60)}"`);
        return rec;
      }
      case 'REPOST': {
        if (!p || platform !== 'twitter' || p.author === agent.id) return null;
        p.reposts++;
        const post = this.newPost('twitter', { author: agent.id, round, content: '', repost_of: p.id });
        ref(p).new_post_id = post.id;
        this.remember(agent.id, `R${round} twitter: reposted @${rec.ref_author} "${clip(rec.ref_content, 60)}"`);
        return rec;
      }
      case 'QUOTE_POST': {
        if (!p || !content || platform !== 'twitter') return null;
        p.quotes++;
        const post = this.newPost('twitter', { author: agent.id, round, content: content.slice(0, 400), quote_of: p.id });
        Object.assign(ref(p), { content: post.content, new_post_id: post.id });
        tone();
        this.remember(agent.id, `R${round} twitter: quoted @${rec.ref_author} with "${clip(content, 100)}"`);
        return rec;
      }
      case 'CREATE_COMMENT': {
        if (!p || !content || platform !== 'reddit') return null;
        const c = { id: `C${++this.state.seq.C}`, author: agent.id, round, content: content.slice(0, 1500), score: 0, votes: {} };
        p.comments.push(c);
        this.comments.set(c.id, { c, post: p });
        Object.assign(ref(p), { comment_id: c.id, content: c.content });
        tone();
        this.remember(agent.id, `R${round} reddit: commented on "${clip(p.title, 50)}": "${clip(content, 100)}"`);
        return rec;
      }
      case 'LIKE_COMMENT':
      case 'DISLIKE_COMMENT': {
        const hit = this.comments.get(String(a.comment_id || '').trim());
        if (!hit || !vote(hit.c, a.action === 'LIKE_COMMENT' ? 1 : -1)) return null;
        Object.assign(rec, { comment_id: hit.c.id, post_id: hit.post.id, ref_author: this.agents[hit.c.author].username, ref_content: clip(hit.c.content, 200) });
        return rec;
      }
      case 'FOLLOW':
      case 'MUTE': {
        if (!target || target.id === agent.id) return null;
        const map = a.action === 'FOLLOW' ? this.state.follows : this.state.mutes;
        const list = (map[agent.id] ||= []);
        if (list.includes(target.id)) return null;
        list.push(target.id);
        rec.target = target.username;
        if (a.action === 'FOLLOW') this.remember(agent.id, `R${round} ${platform}: followed @${target.username}`);
        return rec;
      }
      default:
        return null;
    }
  }
  // Rebuild state from a saved record (ids come out identical when replayed in order).
  replay(rec) {
    this.apply(rec.platform, this.agents[rec.agent_id], { action: rec.action, post_id: rec.post_id, comment_id: rec.comment_id, user: rec.target, title: rec.title, content: rec.content }, rec.round, rec);
  }
}

function agentBlock(world, platform, agent, round) {
  const feed = world.feed(platform, agent, round);
  const memory = (world.state.memory[agent.id] || []).map((m) => `  - ${m}`).join('\n') || '  - (nothing yet)';
  return `### agent ${agent.id} · @${agent.username} — ${agent.name} (${agent.profession || agent.kind}) · stance: ${agent.stance} · mood: ${agent.sentiment.toFixed(1)}
Persona: ${clip(agent.persona, 520)}
Recent activity:
${memory}
Feed:
${feed.map((p) => `  ${world.render(platform, p)}`).join('\n') || '  (nothing new in the feed)'}`;
}

function mockAct(world, platform, batch, round) {
  const verbs = Object.keys(ACTIONS[platform]);
  return {
    actions: batch.map((agent) => {
      const feed = world.feed(platform, agent, round);
      const p = feed[Math.floor(Math.random() * feed.length)];
      const action = p ? verbs[Math.floor(Math.random() * verbs.length)] : 'CREATE_POST';
      const other = world.agents[Math.floor(Math.random() * world.agents.length)];
      return { agent: agent.id, action, post_id: p?.id, comment_id: p?.comments?.[0]?.id, user: other.username, title: `Demo thread R${round}`, content: `Demo take from @${agent.username} in round ${round}.`, sentiment: Math.round((Math.random() * 2 - 1) * 100) / 100 };
    }),
  };
}

function countsOf(actions) {
  const c = { posts: 0, comments: 0, actions: 0, twitter: 0, reddit: 0 };
  for (const r of actions) {
    c.actions++;
    c[r.platform]++;
    if (r.action === 'CREATE_POST' || r.action === 'QUOTE_POST') c.posts++;
    if (r.action === 'CREATE_COMMENT') c.comments++;
  }
  return c;
}
const HARD = ['rate_limited', 'not_granted', 'sampling_disabled', 'session_expired', 'not_declared', 'capability_disabled'];

async function simulate(ctx, { rounds, resume = false }) {
  const sim = ctx.sim;
  const m = sim.meta;
  const { agents, config, ontology } = sim;
  let world;
  let start = 1;
  let mpr;
  if (resume && sim.follows && m.sim?.minutes_per_round) {
    mpr = m.sim.minutes_per_round;
    rounds = m.sim.rounds;
    world = new World(agents, config.hot_topics, sim.follows);
    for (const rec of sim.actions) world.replay(rec);
    start = (m.sim.round || 0) + 1;
    ctx.set({ status: 'running', stage: 'simulation', error: null, resume: null, message: `Resuming at round ${start}` }, true);
    ctx.log(`Resuming at round ${start} of ${rounds}`);
  } else {
    mpr = Math.max(config.minutes_per_round, Math.ceil((config.total_hours * 60) / rounds));
    ctx.set({ status: 'running', stage: 'simulation', progress: 0, error: null, resume: null, message: 'Seeding opening posts', settings: { ...m.settings, rounds }, sim: { round: 0, rounds, minutes_per_round: mpr, clock: fmtClock(clockAt(config, mpr, 0)) } }, true);
    await Store.delColl(`${m.id}/rounds`);
    await Store.del(part(m.id, 'report'));
    sim.actions = [];
    sim.report = emptyReport();
    world = new World(agents, config.hot_topics, seedFollows(agents));
    sim.follows = world.state.follows;
    await Store.put(part(m.id, 'follows'), { follows: sim.follows });
    const c0 = clockAt(config, mpr, 0);
    const seeded = config.initial_posts.map((p) => world.apply(p.platform, agents[p.poster_id], { action: 'CREATE_POST', title: p.title || (p.platform === 'reddit' ? p.content.slice(0, 80) : ''), content: p.content }, 0, c0)).filter(Boolean);
    sim.actions.push(...seeded);
    await Store.put(`${m.id}/rounds/r000`, { round: 0, actions: seeded });
    ctx.emit('actions', seeded);
    ctx.log(`Simulation: ${agents.length} agents, ${rounds} rounds of ${mpr} simulated minutes`);
  }
  m.counts = { ...m.counts, ...countsOf(sim.actions) };

  const background = clip(ontology.analysis_summary, 600);
  let failedRounds = 0;
  for (let round = start; round <= rounds; round++) {
    const clock = clockAt(config, mpr, round);
    const header = `Simulated time: ${fmtClock(clock)} (round ${round} of ${rounds}).\nBackground everyone has heard: ${background}`;
    let calls = 0;
    let failures = 0;
    let hard = null;
    const decided = await Promise.all(PLATFORMS.map(async (platform) => {
      const active = pickActive(agents, config, clock.hour);
      const out = await Promise.all(groups(active, BATCH).map(async (batch) => {
        calls++;
        try {
          const r = await AI.json(ctx, `${actPrompt(platform)}\n\n${header}\n\n${batch.map((a) => agentBlock(world, platform, a, round)).join('\n\n')}`, { tier: 'quick', mock: () => mockAct(world, platform, batch, round) });
          const ids = new Set(batch.map((a) => a.id));
          return (Array.isArray(r?.actions) ? r.actions : []).filter((x) => ids.has(Number(x.agent))).map((x) => ({ platform, agent: agents[Number(x.agent)], a: x }));
        } catch (e) {
          failures++;
          if (e.code === 'cancelled' || HARD.includes(e.code)) hard ||= e;
          else ctx.log(`Round ${round} ${platform} batch failed (${e.code || e.message})`, 'warn');
          return [];
        }
      }));
      return out.flat();
    }));
    if (hard?.code === 'cancelled') break;
    const recs = shuffle(decided.flat()).map((d) => world.apply(d.platform, d.agent, { ...d.a, action: String(d.a.action || '').toUpperCase() }, round, clock)).filter(Boolean);
    sim.actions.push(...recs);
    await Store.put(`${m.id}/rounds/r${pad(round, 3)}`, { round, actions: recs });
    m.counts = { ...m.counts, ...countsOf(sim.actions) };
    ctx.emit('actions', recs);
    ctx.set({
      progress: Math.round((round / rounds) * 100),
      message: `Round ${round}/${rounds} · ${fmtClock(clock)} · ${recs.length} actions`,
      sim: { round, rounds, minutes_per_round: mpr, clock: fmtClock(clock) },
    }, true);
    if (hard) throw hard;
    if (calls && failures === calls) {
      if (++failedRounds >= 2) throw codeErr('upstream_error', 'Two rounds in a row got no answers from Claude.');
    } else failedRounds = 0;
  }
  const stopped = ctx.ctl.signal.aborted;
  const reached = m.sim.round;
  if (stopped && !reached) throw codeErr('cancelled');
  ctx.log(stopped ? `Simulation stopped at round ${reached}` : 'Simulation complete');
  ctx.set({ status: 'simulated', stage: 'simulated', progress: 100, message: stopped ? `Stopped at round ${reached}` : 'Simulation complete' }, true);
}

// =====================================================================
// stage 4-5: evidence, report agent, chat, interviews
// =====================================================================
const emptyReport = () => ({ outline: null, sections: [], log: [], interviews: '', poll: null });

function rebuildWorld(sim) {
  const w = new World(sim.agents, sim.config.hot_topics, sim.follows || {});
  for (const rec of sim.actions) w.replay(rec);
  return w;
}

function buildEvidence(sim) {
  const { meta, agents, graph, ontology, config, actions } = sim;
  const world = rebuildWorld(sim).state;
  const who = (i) => `@${agents[i].username} (${agents[i].name}, ${agents[i].stance})`;
  const at = (r) => { const a = actions.find((x) => x.round === r); return a ? `R${r} Day ${a.day} ${pad(a.hour)}:00` : `R${r}`; };
  const f = {};
  f['question.md'] = `# Prediction question\n${meta.requirement}\n\n## Situation (from the source documents)\n${ontology.analysis_summary || ''}\n\n## Simulation settings\n- Agents: ${agents.length} (${agents.filter((a) => a.ref).length} real actors from the documents, the rest generated members of the public)\n- Rounds run: ${meta.sim?.round ?? 0} of ${meta.sim?.rounds ?? meta.settings.rounds}, ${meta.sim?.minutes_per_round || '?'} simulated minutes each, ending ${meta.sim?.clock || ''}\n- Platforms: a Twitter-like microblog and a Reddit-like forum, running in parallel\n- Hot topics at the start: ${(config.hot_topics || []).join(', ')}\n- Expected direction before the run (a forecast, not a result): ${config.narrative_direction || ''}\n`;
  const acted = new Map();
  for (const a of actions) acted.set(a.agent_id, (acted.get(a.agent_id) || 0) + 1);
  f['agents.md'] = `# Agents\nid | handle | name | kind | role | stance | sentiment | influence | actions | bio\n${agents.map((a) => `${a.id} | @${a.username} | ${a.name} | ${a.kind} | ${a.profession || a.source_type} | ${a.stance} | ${a.sentiment.toFixed(1)} | ${a.influence.toFixed(1)} | ${acted.get(a.id) || 0} | ${clip(a.bio, 140)}`).join('\n')}\n`;
  const nameOf = new Map(graph.nodes.map((n) => [n.id, n.name]));
  f['graph.md'] = `# Knowledge graph from the source documents\n## Entities\n${graph.nodes.map((n) => `- ${n.name} [${n.type}]: ${n.summary}`).join('\n')}\n\n## Facts\n${graph.edges.map((e) => `- ${nameOf.get(e.source)} ${e.type} ${nameOf.get(e.target)}: ${e.fact}`).join('\n')}\n`;
  const tw = world.twitter;
  const twById = new Map(tw.map((p) => [p.id, p]));
  f['twitter.md'] = `# Microblog (Twitter-like): every post in order\n${tw.map((p) => {
    if (p.repost_of) return `[${p.id}] ${at(p.round)} ${who(p.author)} reposted [${p.repost_of}] by @${agents[twById.get(p.repost_of).author].username}`;
    const q = p.quote_of ? ` quoting [${p.quote_of}] @${agents[twById.get(p.quote_of).author].username} "${clip(twById.get(p.quote_of).content, 120)}" —` : '';
    return `[${p.id}] ${at(p.round)} ${who(p.author)}${q} likes ${p.likes}, reposts ${p.reposts}, quotes ${p.quotes}: ${p.content}`;
  }).join('\n')}\n`;
  f['reddit.md'] = `# Forum (Reddit-like): every thread with comments\n${world.reddit.map((p) => `\n## [${p.id}] "${p.title}" — ${who(p.author)}, ${at(p.round)}, score ${p.score}, ${p.comments.length} comments\n${p.content}\n${p.comments.map((c) => `- [${c.id}] ${who(c.author)} ${at(c.round)} score ${c.score}: ${c.content}`).join('\n')}`).join('\n')}\n`;
  const byType = {};
  const perRound = {};
  const voice = {};
  for (const a of actions) {
    byType[`${a.platform} ${a.action}`] = (byType[`${a.platform} ${a.action}`] || 0) + 1;
    perRound[a.round] = (perRound[a.round] || 0) + 1;
    if (['CREATE_POST', 'QUOTE_POST', 'CREATE_COMMENT'].includes(a.action)) { const s = agents[a.agent_id].stance; voice[s] = (voice[s] || 0) + 1; }
  }
  const mix = {};
  for (const a of agents) mix[a.stance] = (mix[a.stance] || 0) + 1;
  const followers = new Map();
  for (const list of Object.values(world.follows)) for (const t of list) followers.set(t, (followers.get(t) || 0) + 1);
  const eng = (p) => p.likes + 2 * p.reposts + 2 * p.quotes;
  const topTw = tw.filter((p) => !p.repost_of).sort((a, b) => eng(b) - eng(a)).slice(0, 10);
  const topRd = [...world.reddit].sort((a, b) => b.score + b.comments.length - (a.score + a.comments.length)).slice(0, 10);
  const rank = (mp, n) => [...mp.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
  f['stats.md'] = `# Simulation statistics
## Totals
- Actions (excluding idle): ${actions.length}
${Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([k, v]) => `- ${k}: ${v}`).join('\n')}

## Stance mix of agents
${Object.entries(mix).map(([k, v]) => `- ${k}: ${v}`).join('\n')}

## Who wrote the content (posts, quotes, comments by author stance)
${Object.entries(voice).map(([k, v]) => `- ${k}: ${v}`).join('\n')}

## Top microblog posts by engagement
${topTw.map((p) => `- [${p.id}] ${who(p.author)} likes ${p.likes}, reposts ${p.reposts}, quotes ${p.quotes}: ${clip(p.content, 200)}`).join('\n')}

## Top forum threads
${topRd.map((p) => `- [${p.id}] "${p.title}" by ${who(p.author)} score ${p.score}, ${p.comments.length} comments`).join('\n')}

## Most active agents
${rank(acted, 10).map(([i, n]) => `- ${who(i)}: ${n} actions`).join('\n')}

## Most followed agents
${rank(followers, 10).map(([i, n]) => `- ${who(Number(i))}: ${n} followers`).join('\n')}

## Activity per round
${Object.entries(perRound).map(([r, n]) => `${at(Number(r))}: ${n}`).join(' · ')}
`;
  if (sim.report?.interviews) f['interviews.md'] = sim.report.interviews;
  if (sim.report?.poll?.results?.length) f['poll.md'] = pollMarkdown(sim);
  if (sim.report?.outline && sim.report.sections.some(Boolean)) f['report.md'] = reportMarkdown(sim);
  return f;
}

function grepFiles(files, pattern, file, context) {
  let re;
  try { re = new RegExp(pattern, 'i'); } catch { re = new RegExp(pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'); }
  const out = [];
  let hits = 0;
  for (const [name, text] of Object.entries(files)) {
    if (file && name !== file) continue;
    const lines = text.split('\n');
    lines.forEach((line, i) => {
      if (hits >= 60 || !re.test(line)) return;
      hits++;
      for (let k = Math.max(0, i - context); k < i; k++) out.push(`${name}-${k + 1}- ${clip(lines[k], 300)}`);
      out.push(`${name}:${i + 1}: ${clip(line, 400)}`);
      for (let k = i + 1; k <= Math.min(lines.length - 1, i + context); k++) out.push(`${name}-${k + 1}- ${clip(lines[k], 300)}`);
    });
  }
  const text = out.join('\n');
  return (text.length > 14000 ? `${text.slice(0, 14000)}\n[... more matches cut; narrow the pattern]` : text) || 'No matches.';
}

function evidenceTools(files, onTool) {
  return [
    { name: 'list_files', description: 'Lists the evidence files with their sizes. Returns one line per file.',
      execute: () => { const r = Object.entries(files).map(([n, t]) => `${n} (${t.split('\n').length} lines)`).join('\n'); onTool('list_files', {}, r); return r; } },
    { name: 'grep', description: 'Searches the evidence files for a regular expression, case-insensitive. Returns matching lines as file:line: text, with optional context lines. Use it to find posts, threads, agents, quotes and numbers.',
      inputSchema: { type: 'object', properties: { pattern: { type: 'string', description: 'regular expression' }, file: { type: 'string', description: 'one file name, or omit to search all' }, context: { type: 'number', description: 'context lines before and after, 0-3' } }, required: ['pattern'] },
      execute: (inp) => { const r = grepFiles(files, String(inp.pattern || ''), inp.file ? String(inp.file) : null, Math.min(3, Math.max(0, Number(inp.context) || 0))); onTool('grep', inp, r); return r; } },
    { name: 'read_file', description: 'Reads a line range of one evidence file (at most 200 lines per call). Returns the lines with their numbers.',
      inputSchema: { type: 'object', properties: { name: { type: 'string' }, start_line: { type: 'number' }, end_line: { type: 'number' } }, required: ['name'] },
      execute: (inp) => {
        const text = files[String(inp.name)];
        if (text == null) throw new Error(`No file named ${inp.name}. Files: ${Object.keys(files).join(', ')}`);
        const lines = text.split('\n');
        const s = Math.max(1, Number(inp.start_line) || 1);
        const e = Math.min(lines.length, Math.max(s, Number(inp.end_line) || s + 199), s + 199);
        const r = lines.slice(s - 1, e).map((l, k) => `${s + k}: ${clip(l, 500)}`).join('\n');
        onTool('read_file', inp, r);
        return r;
      } },
  ];
}

function inlineEvidence(files) {
  const order = ['question.md', 'stats.md', 'poll.md', 'interviews.md', 'report.md', 'agents.md', 'twitter.md', 'reddit.md', 'graph.md'];
  let out = '';
  for (const name of order) {
    if (!files[name]) continue;
    const room = 150000 - out.length;
    if (room < 2000) break;
    out += `\n\n=== ${name} ===\n${clip(files[name], room)}`;
  }
  return out;
}

const INTERVIEW_PROMPT = `You answer an interviewer's questions in character as each of these people, after a social-media storm they took part in. Speak in first person from their persona, stance and what they actually did (their activity log). Natural voice, plain text, no lists or headings. Answer every question, 2-4 sentences each. They don't know they are simulated.
${LANG_RULE}
Reply with only JSON: {"answers":[{"agent":0,"answer":""}]}`;

function activityLines(actions, agentId) {
  return actions.filter((a) => a.agent_id === agentId).slice(-12).map((a) => {
    const what = a.content ? `"${clip(a.content, 140)}"` : a.target ? `@${a.target}` : '';
    const on = a.ref_author ? ` (on @${a.ref_author}: "${clip(a.ref_content, 60)}")` : '';
    return `  - R${a.round} ${a.platform} ${a.action}${on} ${what}`;
  }).join('\n') || '  - (only watched, never acted)';
}

async function interview(ctx, agentIds, question, history = []) {
  const { agents, actions } = ctx.sim;
  const convo = history.slice(-6).map((x) => `${x.role === 'user' ? 'Interviewer' : 'You'}: ${x.content}`).join('\n');
  const chosen = agentIds.map(Number).filter((i) => agents[i]);
  const results = await Promise.all(groups(chosen, 6).map(async (batch) => {
